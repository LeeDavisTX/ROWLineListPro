const LOCATION_FIELDS = CORE_FIELDS.filter((f) => f.t.includes("Location")).map((f) => f.n);
const COPY_DOWN = ["Online", "Order", "DsgnChgPen", "ProjectID", "ProjSize", ...LOCATION_FIELDS];

/* parent currency fields that auto-sum from owner rows (override-able) */
const PARENT_SUM = ["Budget", "IOLAmt", "FOLAmt", "CLTotCost", "OtherCost", "ActCost", "CheckAmt", "RefAmt", "AprAmt"];

/* cost-per-rod = amount / Rods */
const PER_ROD = { BudgetRd: "Budget", IOLCostRd: "IOLAmt", FOLCostRd: "FOLAmt", CLCostRd: "CLTotCost", ActCostRd: "ActCost" };

/* Presentation only. Stored values stay numeric everywhere. */
const MONEY = new Set([...PARENT_SUM, ...Object.keys(PER_ROD), "OtherCost", "EstPermCst"]);
const PERCENT = new Set(["OwnerPct"]);

/* A tract with a design change pending is drawn in red, across the tract row
   and every owner row beneath it. */
const FLAG_FIELD = "DsgnChgPen";
const FLAG_RED = "#B3261E";
const isFlagged = (r) => String(r[FLAG_FIELD] || "").trim().toUpperCase() === "Y";
const CALC  = new Set([...Object.keys(PER_ROD), ...PARENT_SUM, "OwnerCount"]);

/* Every Tract Type except Owner denotes a tract row. Read from the schema so
   a new option in the file needs no code change. */
const PARENT_TYPES = (CORE_FIELDS.find((f) => f.n === "TractType")?.o || []).filter((o) => o !== "Owner");
const ROW_H = 32;
const SAVE_REMINDER_MS = 10 * 60 * 1000;

/* ========================= HELPERS ========================= */
const uid = () => Math.random().toString(36).slice(2, 11);
const pad10 = (n) => String(n).padStart(10, "0");
const num = (v) => { if (v === "" || v === null || v === undefined) return null; const n = parseFloat(String(v).replace(/[$,]/g, "")); return isNaN(n) ? null : n; };
const round = (n, d) => (n === null ? null : Math.round(n * 10 ** d) / 10 ** d);

const isOwnerRow  = (r) => r.TractType === "Owner";
/* Two different ideas, deliberately separate.

   CROSSING_ONLY  - Permit and Encroachment. Restricted routing: Tract,
                    Location, Crossings and Cost only, and no owner rows.
   CARRIES_CROSSING - types that hold crossing data and so appear on the
                    Crossings grid and get its form tab. Exclusive Easement is
                    here as well: it is an ordinary parent tract in every other
                    respect, with owners, title, acquisition and stipulations,
                    but it is also something the line crosses. */
const CROSSING_ONLY = new Set(["Permit", "Encroachment"]);
const CARRIES_CROSSING = new Set(["Permit", "Encroachment", "Exclusive Easement"]);
const isPermitRow = (r) => CROSSING_ONLY.has(r.TractType);
const hasCrossing = (r) => CARRIES_CROSSING.has(r.TractType);

const fmtMoney = (v) => {
  const n = num(v);
  if (n === null) return v ?? "";
  return n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtPct = (v) => {
  const n = num(v);
  if (n === null) return v ?? "";
  return `${n.toLocaleString("en-US", { maximumFractionDigits: 4 })}%`;
};
const fmtDateUS = (v) => {
  if (!v) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  return m ? `${m[2]}/${m[3]}/${m[1]}` : String(v);
};
const toISODate = (v) => {
  if (v === "" || v === null || v === undefined) return "";
  if (typeof v === "number") { const d = new Date(Date.UTC(1899, 11, 30 + v)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if (m) return `${m[3]}-${String(m[1]).padStart(2, "0")}-${String(m[2]).padStart(2, "0")}`;
  const d = new Date(s);
  return isNaN(d) ? s : d.toISOString().slice(0, 10);
};

const isNumericType = (y) => y === "Decimal Number" || y === "Short Integer" || y === "Long Integer";

const displayValue = (f, v) => {
  if (v === null || v === undefined || v === "") return "";
  if (MONEY.has(f.n)) return fmtMoney(v);
  if (PERCENT.has(f.n)) return fmtPct(v);
  if (f.y === "Date") return fmtDateUS(v);
  return String(v);
};

/* ========================= DERIVE ENGINE ========================= */
/* Recomputes copy-down, owner counts, parent sums, and cost-per-rod.
   A cell the user has typed into is in `ov` and is left alone. */
const ovKey = (id, n) => `${id}::${n}`;

function derive(rows, ov) {
  const out = rows.map((r) => ({ ...r }));
  const parents = out.filter((r) => !isOwnerRow(r));
  const byTractId = new Map();
  parents.forEach((p) => { if (p.TractID) byTractId.set(String(p.TractID), p); });

  const kids = new Map();
  out.forEach((r) => {
    if (!isOwnerRow(r)) return;
    const k = String(r.ParentID || "");
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(r);
  });

  parents.forEach((p) => {
    const owners = kids.get(String(p.TractID)) || [];

    // copy down tract-level facts
    owners.forEach((o) => { COPY_DOWN.forEach((n) => { o[n] = p[n] ?? ""; }); });

    // owner count is the row count, full stop — it is how the app tells a
    // single-owner tract from a multi-owner one, so it cannot be overridden
    p.OwnerCount = isPermitRow(p) ? "" : owners.length;

    // parent currency roll-up
    if (owners.length) {
      PARENT_SUM.forEach((n) => {
        if (ov.has(ovKey(p._id, n))) return;
        let any = false, sum = 0;
        owners.forEach((o) => { const v = num(o[n]); if (v !== null) { any = true; sum += v; } });
        if (any) p[n] = round(sum, 2);
      });
    }
  });

  // cost per rod, every row
  out.forEach((r) => {
    const rods = num(r.Rods);
    Object.entries(PER_ROD).forEach(([per, amt]) => {
      if (ov.has(ovKey(r._id, per))) return;
      const a = num(r[amt]);
      r[per] = a !== null && rods ? round(a / rods, 2) : "";
    });
  });

  // Re-seat every owner row beneath its parent. Without this, reassigning a
  // ParentID leaves the row sitting next to the tract it used to belong to.
  const ordVal = (r) => { const n = num(r.Order); return n === null ? Infinity : n; };   // blanks last
  const byId = (a, b) => String(a.TractID ?? "").localeCompare(String(b.TractID ?? ""), undefined, { numeric: true });
  /* Order is user-set and need not be unique, so SysID breaks the tie and
     carries the blanks. It is sequential, so this is creation order. */
  const bySys = (a, b) => String(a.SysID ?? "").localeCompare(String(b.SysID ?? ""));

  const ordered = [];
  const placed = new Set();
  [...parents].sort((a, b) => (ordVal(a) - ordVal(b)) || bySys(a, b)).forEach((p) => {
    ordered.push(p);
    placed.add(p._id);
    [...(kids.get(String(p.TractID)) || [])].sort(byId).forEach((o) => { ordered.push(o); placed.add(o._id); });
  });
  out.forEach((r) => { if (!placed.has(r._id)) ordered.push(r); });   // owners with no parent
  return ordered;
}

/* Feet / Rods / Miles are conversions of one another; editing any one
   rewrites the other two on that row. */
function applyLengthConversion(row, field, value) {
  const v = num(value);
  if (v === null) return;
  if (field === "Feet")  { row.Rods = round(v / 16.5, 2);  row.Miles = round(v / 5280, 4); }
  if (field === "Rods")  { row.Feet = round(v * 16.5, 2);  row.Miles = round((v * 16.5) / 5280, 4); }
  if (field === "Miles") { row.Feet = round(v * 5280, 2);  row.Rods = round((v * 5280) / 16.5, 2); }
}

/* ========================= ROW VISIBILITY PER GRID ========================= */
function gridRows(key, rows) {
  switch (key) {
    // Tract and Cost show every row. Crossing rows (Permit, Encroachment) are
    // limited to Tract, Location, Crossings and Cost.
    case "tract":  return rows;
    case "cost":   return rows;
    case "cross":  return rows.filter((r) => !isOwnerRow(r) && hasCrossing(r));
    // Location is a tract-level record, and a crossing has a location like any
    // other tract, so every non-owner row appears here.
    case "loc":    return rows.filter((r) => !isOwnerRow(r));
    case "owner":
    case "title":
    case "acq":
    case "legal":  return rows.filter((r) => !isPermitRow(r));
    // Field Survey, Plat, Construction, Operations are parent-tract records.
    default:       return rows.filter((r) => !isOwnerRow(r) && !isPermitRow(r));
  }
}

/* Probe gridRows rather than maintaining a parallel list, so the row-type
   filter always agrees with what a grid actually shows. */
const KIND_PROBE = [
  { _id: "p", TractID: "p", TractType: "Parent" },
  { _id: "e", TractID: "e", TractType: "Exclusive Easement" },   // parent kind, but crosses
  { _id: "o", TractID: "o", TractType: "Owner", ParentID: "p" },
  { _id: "m", TractID: "m", TractType: "Permit" },
  { _id: "n", TractID: "n", TractType: "Encroachment" },
];
const rowKind = (r) => (isOwnerRow(r) ? "owner" : isPermitRow(r) ? "permit" : "parent");
function gridKinds(key) {
  const r = gridRows(key, KIND_PROBE).map((x) => x._id);
  return {
    parent: r.includes("p") || r.includes("e"),
    owner: r.includes("o"),
    permit: r.includes("m") || r.includes("n"),
  };
}


/* ========================= APP ========================= */
function ROWLineListPro() {
  const [customFields, setCustomFields] = useState([]);
  const [rows, setRows] = useState([]);
  const [ov, setOv] = useState(() => new Set());
  const [project, setProject] = useState(() => Object.fromEntries(PROJECT_FIELDS.map((n) => [n, ""])));
  const [sysSeq, setSysSeq] = useState(1);
  const [currentUser, setCurrentUser] = useState("");

  const [view, setView] = useState({ type: "grid", key: "tract" });
  const [selected, setSelected] = useState(null);       // parent TractID
  const [focusTick, setFocusTick] = useState(0);        // bumped to scroll the stepped-to row into view
  const [formSide, setFormSide] = useState("parent");   // "parent" | ownerRowId
  const [formTab, setFormTab] = useState("Parent Tract");

  const [search, setSearch] = useState("");
  const [filters, setFilters] = useState({});
  const [showFilters, setShowFilters] = useState(false);
  const [onlineOnly, setOnlineOnly] = useState(true);   // offline tracts hidden until switched off
  const [rowKinds, setRowKinds] = useState({ parent: true, owner: true, permit: true });
  const [hidden, setHidden] = useState({});             // {gridKey: Set(fieldName)}
  const [sort, setSort] = useState({ col: null, dir: 1 });
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [dirty, setDirty] = useState(false);

  const fileRef = useRef(null);
  const toastTimer = useRef(null);

  const allFields = useMemo(() => [...CORE_FIELDS, ...customFields], [customFields]);
  const fieldByName = useMemo(() => Object.fromEntries(allFields.map((f) => [f.n, f])), [allFields]);

  const notify = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 5000);
  }, []);

  /* -------- unsaved-work guards -------- */
  useEffect(() => {
    const h = (e) => { if (rows.length) { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", h);
    return () => window.removeEventListener("beforeunload", h);
  }, [rows.length]);

  useEffect(() => {
    const t = setInterval(() => {
      if (rows.length && dirty) { setModal({ type: "remind" }); setDirty(false); }
    }, SAVE_REMINDER_MS);
    return () => clearInterval(t);
  }, [rows.length, dirty]);

  /* -------- derived collections -------- */
  const parentRows = useMemo(() => rows.filter((r) => !isOwnerRow(r)), [rows]);
  const parentIds = useMemo(() => parentRows.map((r) => String(r.TractID)).filter(Boolean), [parentRows]);
  const selectedParent = useMemo(() => parentRows.find((r) => String(r.TractID) === String(selected)) || null, [parentRows, selected]);
  const selectedOwners = useMemo(
    () => rows.filter((r) => isOwnerRow(r) && String(r.ParentID) === String(selected)),
    [rows, selected]
  );

  const commit = useCallback((next, nextOv) => {
    const o = nextOv || ov;
    setRows(derive(next, o));
    setDirty(true);
  }, [ov]);

  /* -------- who touched it, and when -------- */
  const today = () => new Date().toISOString().slice(0, 10);
  const stampEdit = useCallback((r) => {
    const out = { ...r, EditDate: today() };
    if (currentUser.trim()) out.EditBy = currentUser.trim();
    return out;
  }, [currentUser]);

  /* Moving an owner to a different tract. Any ID still on the default
     "<parent>.001" pattern follows the move; a hand-typed ID is left alone. */
  const reparent = (copy, before, prev, rowId, newPid) => {
    const oldPid = String(before.ParentID || "");
    if (!oldPid || !newPid || oldPid === newPid) return;
    const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const oldPat = new RegExp("^" + esc(oldPid) + "\\.\\d+$");
    const newPat = new RegExp("^" + esc(String(newPid)) + "\\.(\\d+)$");
    let hi = 0;
    prev.forEach((x) => {
      if (x._id === rowId) return;
      [x.TractID, x.OwnerID].forEach((idv) => {
        const m = newPat.exec(String(idv || ""));
        if (m) hi = Math.max(hi, parseInt(m[1], 10));
      });
    });
    const nextId = `${newPid}.${String(hi + 1).padStart(3, "0")}`;
    if (oldPat.test(String(before.TractID || ""))) copy.TractID = nextId;
    if (oldPat.test(String(before.OwnerID || ""))) copy.OwnerID = nextId;
  };

  /* -------- cell edit -------- */
  const setCell = useCallback((rowId, field, value) => {
    const nextOv = new Set(ov);
    if (CALC.has(field)) {
      if (value === "" ) nextOv.delete(ovKey(rowId, field));
      else nextOv.add(ovKey(rowId, field));
    }
    setOv(nextOv);

    setRows((prev) => {
      const next = prev.map((r) => {
        if (r._id !== rowId) return r;
        const copy = stampEdit({ ...r, [field]: value });
        if (field === "Feet" || field === "Rods" || field === "Miles") applyLengthConversion(copy, field, value);
        if (field === "ParentID" && isOwnerRow(r)) reparent(copy, r, prev, rowId, String(value || ""));
        return copy;
      });
      return derive(next, nextOv);
    });
    setDirty(true);
  }, [ov, stampEdit]);

  /* -------- add tract --------
     ownerVals present means a single-owner tract: the tract row and its one
     ownership interest are written together, so the hierarchy stays uniform
     while the user only fills one form. */
  const addTract = (vals, owners, single) => {
    const wanted = String(vals.TractID);
    if (rows.some((r) => String(r.TractID) === wanted || String(r.OwnerID) === wanted)) {
      notify(`Tract ID ${wanted} already exists on this line list. Use a different ID.`); return;
    }
    const d = today();
    const stamp = (r) => {
      r.CreateDate = d; r.EditDate = d;
      r.CreateBy = currentUser.trim(); r.EditBy = currentUser.trim();
    };

    const t = { _id: uid() };
    allFields.forEach((f) => (t[f.n] = ""));
    Object.assign(t, project, vals);
    if (!t.Online) t.Online = "Y";
    t.SysID = pad10(sysSeq);
    stamp(t);

    const next = [...rows, t];
    const list = (owners || []).filter((x) => String(x.OwnerName || "").trim());

    list.forEach((src, i) => {
      const o = { _id: uid() };
      allFields.forEach((f) => (o[f.n] = ""));
      Object.assign(o, project);
      COPY_DOWN.forEach((n) => (o[n] = t[n] ?? ""));
      const oid = `${vals.TractID}.${String(i + 1).padStart(3, "0")}`;
      o.TractType = "Owner";
      o.TractName = "";
      o.ParentID = String(vals.TractID);
      o.TractID = oid;
      o.OwnerID = oid;
      o.OwnerType = src.OwnerType || "Individual";
      o.OwnerName = String(src.OwnerName).trim();
      o.OwnerPct = String(src.OwnerPct || "").trim();
      if (single && !o.OwnerPct) o.OwnerPct = 100;    // one interest is the whole
      o.SysID = pad10(sysSeq + 1 + i);
      stamp(o);
      next.push(o);
    });

    setSysSeq((s) => s + 1 + list.length);
    commit(next);
    setSelected(String(vals.TractID));
    setModal(null);
    notify(list.length
      ? `Tract ${vals.TractID} added with ${list.length} owner${list.length > 1 ? "s" : ""}.`
      : `Tract ${vals.TractID} added. Use Add owner to record ownership interests.`);
  };

  /* -------- add owner -------- */
  /* Highest existing suffix plus one, not sibling count plus one: after .001
     is deleted, count-based numbering would reissue .002 and collide. */
  const nextOwnerId = (parentTractId) => {
    let hi = 0;
    const pat = new RegExp("^" + String(parentTractId).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\.(\\d+)$");
    rows.forEach((r) => {
      [r.TractID, r.OwnerID].forEach((idv) => {
        const m = pat.exec(String(idv || ""));
        if (m) hi = Math.max(hi, parseInt(m[1], 10));
      });
    });
    return `${parentTractId}.${String(hi + 1).padStart(3, "0")}`;
  };

  const addOwner = (vals) => {
    const parent = parentRows.find((r) => String(r.TractID) === String(vals.ParentID));
    if (!parent) { notify("Pick an existing parent tract first."); return; }
    const wanted = String(vals.OwnerID || vals.TractID);
    if (rows.some((r) => String(r.TractID) === wanted || String(r.OwnerID) === wanted)) {
      notify(`ID ${wanted} is already on this line list. Use a different Owner Tract ID.`); return;
    }
    const d = today();
    const r = { _id: uid() };
    allFields.forEach((f) => (r[f.n] = ""));
    Object.assign(r, project);
    COPY_DOWN.forEach((n) => (r[n] = parent[n] ?? ""));
    Object.assign(r, vals);
    r.TractType = "Owner";
    r.TractName = "";
    r.SysID = pad10(sysSeq);
    r.CreateDate = d; r.EditDate = d;
    r.CreateBy = currentUser.trim(); r.EditBy = currentUser.trim();
    setSysSeq((s) => s + 1);
    commit([...rows, r]);
    setSelected(String(parent.TractID));
    setModal(null);
    notify(`Owner ${vals.OwnerName} added to ${parent.TractID}.`);
  };

  /* -------- delete -------- */
  const deleteRow = (row) => {
    if (isOwnerRow(row)) {
      commit(rows.filter((r) => r._id !== row._id));
      notify("Owner row deleted.");
    } else {
      const doomed = new Set([row._id, ...rows.filter((r) => isOwnerRow(r) && String(r.ParentID) === String(row.TractID)).map((r) => r._id)]);
      const left = rows.filter((r) => !doomed.has(r._id));
      commit(left);
      if (String(selected) === String(row.TractID)) {
        // Move to the next surviving tract rather than clearing the selection,
        // which would leave the form view with nothing to show.
        const next = left.find((r) => !isOwnerRow(r) && r.TractID);
        setSelected(next ? String(next.TractID) : null);
        if (!next) setView({ type: "grid", key: "tract" });
      }
      notify(`Tract ${row.TractID} and ${doomed.size - 1} owner row(s) deleted.`);
    }
    setModal(null);
  };

  /* -------- project header edits write through to every row -------- */
  const setProjectField = (n, v) => {
    setProject((p) => ({ ...p, [n]: v }));
    setRows((prev) => prev.map((r) => stampEdit({ ...r, [n]: v })));
    setDirty(true);
  };

  /* -------- bulk owner-name update -------- */
  const ownerGroups = useMemo(() => {
    const m = new Map();
    rows.filter(isOwnerRow).forEach((r) => {
      const k = String(r.OwnerName || "").trim();
      if (!k) return;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(r);
    });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  }, [rows]);

  /* Attributes of the person, not of their interest in a particular tract, so
     they update across every row carrying that owner's name. Ownership
     percentage is deliberately absent: it differs tract by tract. */
  const OWNER_BULK = ["OwnerName", "OwnerType", "OwnerCon", "OwnerAddr1", "OwnerAddr2",
                      "OwnerPhone", "OwnerEmail", "W9Status", "OwnerAtt", "OwnAttCon", "OnSite"];

  const bulkUpdateOwner = (name, patch) => {
    setRows((prev) => derive(prev.map((r) => (isOwnerRow(r) && String(r.OwnerName || "").trim() === name ? stampEdit({ ...r, ...patch }) : r)), ov));
    setDirty(true);
    notify(`Updated every row for ${patch.OwnerName || name}.`);
  };


  /* -------- columns for the active grid -------- */
  const activeGrid = view.type === "grid" ? GRIDS.find((g) => g.key === view.key) : null;

  const gridColumns = useCallback((g) => {
    const seen = new Set();
    const cols = [];
    const push = (n) => { const f = fieldByName[n]; if (f && !seen.has(n)) { seen.add(n); cols.push(f); } };
    LEAD_COLS.forEach(push);
    allFields.forEach((f) => { if (f.t.some((t) => g.tabs.includes(t))) push(f.n); });
    return cols;
  }, [allFields, fieldByName]);

  const allCols = activeGrid ? gridColumns(activeGrid) : [];
  const hiddenSet = activeGrid ? (hidden[activeGrid.key] || new Set()) : new Set();
  const cols = allCols.filter((f) => !hiddenSet.has(f.n));

  const baseRows = activeGrid ? gridRows(activeGrid.key, rows) : [];
  /* Which boxes are live on this grid, and a guard so the last live one
     cannot be unchecked and leave an empty screen. */
  const kindsHere = useMemo(() => (activeGrid ? gridKinds(activeGrid.key)
    : { parent: true, owner: true, permit: true }), [activeGrid]);
  const liveKinds = ["parent", "owner", "permit"].filter((k) => kindsHere[k]);
  const toggleKind = useCallback((k) => {
    setRowKinds((prev) => {
      const on = liveKinds.filter((x) => prev[x]);
      if (prev[k] && on.length <= 1) return prev;        // last one stays checked
      return { ...prev, [k]: !prev[k] };
    });
  }, [liveKinds.join(",")]);

  const visibleRows = useMemo(() => {
    let out = baseRows;
    if (onlineOnly) out = out.filter((r) => String(r.Online || "").trim().toUpperCase() === "Y");
    out = out.filter((r) => rowKinds[rowKind(r)] !== false);
    const q = search.trim().toLowerCase();
    if (q) out = out.filter((r) => Object.entries(r).some(([k, v]) => k !== "_id" && String(v ?? "").toLowerCase().includes(q)));
    Object.entries(filters).forEach(([n, val]) => {
      if (!val) return;
      const t = String(val).toLowerCase();
      out = out.filter((r) => String(r[n] ?? "").toLowerCase().includes(t));
    });
    if (sort.col) {
      const f = fieldByName[sort.col];
      out = [...out].sort((a, b) => {
        const av = a[sort.col], bv = b[sort.col];
        if (f && isNumericType(f.y)) return ((num(av) ?? -Infinity) - (num(bv) ?? -Infinity)) * sort.dir;
        return String(av ?? "").localeCompare(String(bv ?? ""), undefined, { numeric: true }) * sort.dir;
      });
    }
    return out;
  }, [baseRows, onlineOnly, rowKinds, search, filters, sort, fieldByName]);

  /* Permits and encroachments never take owner rows. */
  const ownerEligible = useMemo(
    () => parentRows.filter((r) => !isPermitRow(r) && r.TractID), [parentRows]);

  const selectFromRow = (r) => setSelected(isOwnerRow(r) ? String(r.ParentID) : String(r.TractID));

  /* Tracts reachable by the stepper, in the order they appear on screen, so it
     never jumps to something a filter is hiding. Owner rows resolve to their
     parent, which keeps the stepper working in an owner-only view. */
  const cycleTracts = useMemo(() => {
    /* Outside grid view there are no visible rows to walk, so fall back to
       every tract in row order, still honouring the online filter. */
    const source = activeGrid
      ? visibleRows
      : rows.filter((r) => !onlineOnly || String(r.Online || "").trim().toUpperCase() === "Y");

    const seen = new Set();
    const out = [];
    source.forEach((r) => {
      const pid = String(isOwnerRow(r) ? r.ParentID : r.TractID);
      if (!pid || seen.has(pid)) return;
      seen.add(pid);
      out.push(pid);
    });
    return out;
  }, [activeGrid, visibleRows, rows, onlineOnly]);

  const cycleIdx = cycleTracts.indexOf(String(selected));
  const step = useCallback((dir) => {
    if (!cycleTracts.length) return;
    const i = cycleTracts.indexOf(String(selected));
    const next = i === -1 ? (dir > 0 ? 0 : cycleTracts.length - 1)
                          : (i + dir + cycleTracts.length) % cycleTracts.length;
    setSelected(cycleTracts[next]);
    setFocusTick((t) => t + 1);
  }, [cycleTracts, selected]);

  /* ========================= EXPORT ========================= */
  /* Suggested name, offered in the download dialog so it can be changed. */
  const suggestedFileName = () => {
    const tag = (project.ProjectNam || project.ProjectID || "Project").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 40);
    return `ROW_LineList_${tag}_${new Date().toISOString().slice(0, 10)}`;
  };

  const askDownload = () => {
    if (!rows.length) { notify("Nothing to download yet. Add a tract or import a line list."); return; }
    setModal({ type: "download", name: suggestedFileName() });
  };

  const exportXlsx = (fileName) => {
    if (!rows.length) { notify("Nothing to download yet. Add a tract or import a line list."); return; }
    /* Column order matches the schema file row for row, with any custom fields
       appended after the core set. */
    const order = allFields;

    /* Headers are the aliases. Import reads them back through the Fields sheet,
       which carries the alias alongside the ten-character field name. */
    const header = order.map((f) => f.a);
    const data = rows.map((r) => {
      const o = {};
      order.forEach((f) => {
        let v = r[f.n] ?? "";
        if (f.y === "Date" && v) v = fmtDateUS(v);
        else if (isNumericType(f.y) && v !== "") { const n = num(v); v = n === null ? v : n; }
        o[f.a] = v;
      });
      return o;
    });

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(data, { header });
    ws1["!cols"] = order.map((f) => ({ wch: Math.max(12, Math.min(34, f.a.length + 2)) }));
    XLSX.utils.book_append_sheet(wb, ws1, "Line List");

    const fieldRows = order.map((f) => {
      const row = { "Field ID": f.i, "Field Name": f.n, "Alias": f.a, "View Tabs": f.t.join(", "), "Field Type": f.y };
      (f.o || []).forEach((opt, i) => (row[`Attribute ${i + 1}`] = opt));
      return row;
    });
    const ws2 = XLSX.utils.json_to_sheet(fieldRows);
    XLSX.utils.book_append_sheet(wb, ws2, "Fields");

    const safe = String(fileName || suggestedFileName())
      .replace(/\.xlsx$/i, "")
      .replace(/[\\/:*?"<>|]+/g, "-")     // characters no file system will take
      .trim()
      .slice(0, 120) || suggestedFileName();
    XLSX.writeFile(wb, `${safe}.xlsx`);
    setDirty(false);
    setModal(null);
    notify(`Downloaded ${safe}.xlsx — this is the only copy, the app stores nothing.`);
  };

  /* ========================= IMPORT ========================= */
  const doImport = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: false });
        const added = [];
        const known = new Set(allFields.map((f) => f.n));

        // read a Fields sheet if the file carries one
        const fsheet = wb.Sheets["Fields"];
        if (fsheet) {
          let nextId = 90000 + customFields.length;
          XLSX.utils.sheet_to_json(fsheet, { defval: "" }).forEach((rec) => {
            const n = String(rec["Field Name"] || "").trim();
            if (!n || known.has(n)) return;
            const opts = Object.keys(rec).filter((k) => /^Attribute /.test(k)).map((k) => String(rec[k]).trim()).filter(Boolean);
            const f = {
              i: ++nextId,
              n,
              a: String(rec["Alias"] || n).trim(),
              t: String(rec["View Tabs"] || "Parent Tract").split(",").map((x) => x.trim()).filter(Boolean),
              y: String(rec["Field Type"] || "Short Text").trim(),
              custom: true,
            };
            if (opts.length) f.o = opts;
            known.add(n);
            added.push(f);
          });
        }

        const all = [...allFields, ...added];
        const nameSet = new Set(all.map((f) => f.n));
        const typeByName = Object.fromEntries(all.map((f) => [f.n, f.y]));

        /* Column headers may be ten-character field names or aliases. Aliases in
           the file's own Fields sheet win, so a renamed alias still round-trips. */
        const aliasMap = { ...ALIAS_TO_NAME };
        all.forEach((f) => { aliasMap[String(f.a).trim().toLowerCase()] = f.n; });
        if (fsheet) {
          XLSX.utils.sheet_to_json(fsheet, { defval: "" }).forEach((rec) => {
            const fn = String(rec["Field Name"] || "").trim();
            const al = String(rec["Alias"] || "").trim();
            if (fn && al && nameSet.has(fn)) aliasMap[al.toLowerCase()] = fn;
          });
        }
        const resolve = (h) => {
          const k = String(h).trim();
          if (nameSet.has(k)) return k;
          return aliasMap[k.toLowerCase()] || null;
        };

        const sheet = wb.Sheets["Line List"] || wb.Sheets[wb.SheetNames[0]];
        if (!sheet) throw new Error("no sheet");
        const raw = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!raw.length) throw new Error("empty");

        const rejected = new Set();
        const proj = {};
        const problems = [];
        let seq = 0;
        const fldByName = Object.fromEntries(all.map((f) => [f.n, f]));

        const imported = raw.map((rec, idx) => {
          const r = { _id: uid() };
          all.forEach((f) => (r[f.n] = ""));
          const rowNo = idx + 2;                                   // sheet row, header is 1
          const rowId = () => String(rec["Tract ID"] ?? rec.TractID ?? "").trim();

          Object.entries(rec).forEach(([k, v]) => {
            const key = resolve(k);
            if (!key) { rejected.add(String(k).trim()); return; }
            const f = fldByName[key];
            const raw0 = v;
            const txt = String(v ?? "").trim();
            const log = (issue, kept) =>
              problems.push({ row: rowNo, tract: rowId(), field: f ? f.a : key,
                              name: key, value: String(raw0 ?? ""), issue, kept });

            if (txt === "") { r[key] = ""; return; }

            /* A type mismatch cannot be stored, so the cell is left blank and
               reported. A value outside a pick list is kept as typed. */
            if (f && f.y === "Date") {
              const iso = toISODate(raw0);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) {
                r[key] = ""; log("Not a date", "cleared"); return;
              }
              r[key] = iso; return;
            }

            if (f && isNumericType(f.y)) {
              if (num(raw0) === null) { r[key] = ""; log("Not a number", "cleared"); return; }
              r[key] = raw0; return;
            }

            if (f && f.o && f.o.length) {
              const allowed = new Set(f.o.map((o) => String(o)));
              if (f.y === "Multiple Selection") {
                const bad = txt.split(",").map((x) => x.trim()).filter((x) => x && !allowed.has(x));
                if (bad.length) log(`Not in list: ${bad.join(", ")}`, "kept");
              } else if (!allowed.has(txt)) {
                log("Not in list", "kept");
              }
            }

            r[key] = raw0;
          });
          PROJECT_FIELDS.forEach((p) => { if (r[p] && !proj[p]) proj[p] = r[p]; });
          const s = parseInt(r.SysID, 10);
          if (!isNaN(s)) seq = Math.max(seq, s);
          if (!r.TractType) r.TractType = r.ParentID ? "Owner" : "Parent";
          if (!String(r.Online || "").trim()) r.Online = "Y";   // no column means nothing is retired
          return r;
        });
        imported.forEach((r) => { if (!r.SysID) r.SysID = pad10(++seq); });

        // Duplicate Tract IDs in the file break parent/owner matching, so they
        // are reported alongside the value problems.
        const idCount = {};
        imported.forEach((r) => { const k = String(r.TractID || "").trim(); if (k) idCount[k] = (idCount[k] || 0) + 1; });
        Object.entries(idCount).forEach(([k, nDup]) => {
          if (Number(nDup) > 1) problems.push({ row: "\u2014", tract: k, field: "Tract ID", name: "TractID",
            value: k, issue: `Appears ${Number(nDup)} times in the file`, kept: "kept" });
        });

        if (added.length) setCustomFields((p) => [...p, ...added]);
        if (Object.keys(proj).length) setProject((p) => ({ ...p, ...proj }));
        setSysSeq(seq + 1);

        const freshOv = new Set();
        setOv(freshOv);
        setRows(derive(imported, freshOv));
        setFilters({}); setSearch(""); setSort({ col: null, dir: 1 });
        const first = imported.find((r) => !isOwnerRow(r));
        setSelected(first ? String(first.TractID) : null);
        setDirty(false);

        const msg = [`Imported ${imported.length} rows.`];
        if (added.length) msg.push(`${added.length} field(s) added from the Fields sheet.`);
        if (rejected.size) msg.push(`Skipped unmatched columns: ${[...rejected].slice(0, 5).join(", ")}${rejected.size > 5 ? "…" : ""}`);
        if (problems.length) msg.push(`${problems.length} value(s) need review.`);
        notify(msg.join(" "));
        if (problems.length) setModal({ type: "importErrors", problems, columns: [...rejected] });
      } catch {
        notify("That file could not be read as a line list. It needs a Line List sheet with a header row of field names.");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const onPickFile = (e) => {
    const el = e.target;
    const f = el && el.files ? el.files[0] : null;
    if (el) el.value = "";
    if (!f) return;
    if (rows.length) setModal({ type: "confirmImport", file: f });
    else doImport(f);
  };


  /* ========================= RENDER ========================= */
  const formTabs = useMemo(() => {
    const t = TAB_ORDER.filter((x) => x !== "Project");
    return t.filter((x) => (x === "Crossings" ? selectedParent && hasCrossing(selectedParent) : true));
  }, [selectedParent]);

  useEffect(() => { if (!formTabs.includes(formTab)) setFormTab(formTabs[0] || "Parent Tract"); }, [formTabs, formTab]);
  /* Moving to another tract lands on its parent record. The form tab is left
     alone, so stepping through tracts stays on Legal, Cost, or wherever the
     user is working. */
  useEffect(() => { setFormSide("parent"); }, [selected]);

  /* Opening the form from a grid lands on that grid's tab, so the context the
     user was working in carries over instead of resetting to Parent Tract. */
  /* Alt with the arrow keys walks tracts without leaving the keyboard, and the
     modifier keeps it clear of plain arrow use inside a cell. */
  useEffect(() => {
    const h = (e) => {
      if (!e.altKey || e.metaKey || e.ctrlKey) return;
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [step]);

  const openForm = useCallback((r) => {
    const pid = String(isOwnerRow(r) ? r.ParentID : r.TractID);
    setSelected(pid);
    setView({ type: "form" });

    const want = activeGrid ? activeGrid.tabs[0] : null;

    // Some tabs only exist on one side of the record; land on the side that has it.
    let side = isOwnerRow(r) ? r._id : "parent";
    if (want && PARENT_ONLY_TABS.has(want)) {
      side = "parent";
    } else if (want === "Owner" && !isOwnerRow(r)) {
      const first = rows.find((x) => isOwnerRow(x) && String(x.ParentID) === pid);
      side = first ? first._id : "parent";
    }

    setFormSide(side);
    if (want) setFormTab(want);
  }, [activeGrid, rows]);

  const formRow = formSide === "parent" ? selectedParent : rows.find((r) => r._id === formSide) || selectedParent;

  return (
    <div className="rlp" style={SHELL}>
      <style>{CSS}</style>

      <header className="topbar" style={BAR_TOP}>
        <div className="brand">
          <span className="mark">ROW</span>
          <span style={{ display: "flex", flexDirection: "column", lineHeight: 1.1 }}>
            <span className="wordmark">Line List<em>Pro</em></span>
            <span style={{ fontSize: 9.5, letterSpacing: ".10em", textTransform: "uppercase",
                           color: "#9FC2E5", fontWeight: 600 }}>{SCHEMA_VERSION}</span>
          </span>
        </div>

        <div className="projstrip">
          {PROJECT_FIELDS.map((n) => {
            const f = fieldByName[n];
            if (!f) return null;
            return (
              <label key={n} className="projfield">
                <span>{f.a}</span>
                {f.y === "List" ? (
                  <select value={project[n] || ""} onChange={(e) => setProjectField(n, e.target.value)}>
                    <option value="" />
                    {(f.o || []).map((o) => <option key={o} value={o}>{o}</option>)}
                  </select>
                ) : (
                  <input value={project[n] || ""} onChange={(e) => setProjectField(n, e.target.value)} />
                )}
              </label>
            );
          })}
          <label className="projfield" style={{ minWidth: 130 }}>
            <span>User Name</span>
            <input value={currentUser} placeholder="Stamps new and edited rows"
              onChange={(e) => setCurrentUser(e.target.value)} />
          </label>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: "0 0 auto",
                      paddingRight: 12, marginRight: 2, borderRight: "1px solid #2C4B75" }}>
          <span style={{ display: "flex", flexDirection: "column", lineHeight: 1.25, textAlign: "right" }}>
            <span style={{ fontSize: 9.5, letterSpacing: ".11em", textTransform: "uppercase",
                           color: "#F0C36B", fontWeight: 700 }}>Browser only</span>
            <span style={{ fontSize: 11.5, color: "#D6E3F0", whiteSpace: "nowrap" }}>
              Download file to save work
            </span>
          </span>
        </div>

        <div className="topactions">
          <input ref={fileRef} type="file" accept=".xlsx,.xls" hidden onChange={onPickFile} />
          <button className="btn pale" onClick={() => fileRef.current?.click()}>Import</button>
          <button className="btn pale" onClick={askDownload}>Download</button>
        </div>
      </header>

      {/* tract header strip — layout set inline so no stylesheet can restack it */}
      <section style={TB_STRIP}>
        {HEADER_FIELDS.map((n) => {
          const f = fieldByName[n];
          const val = selectedParent ? (displayValue(f, selectedParent[n]) || "\u2014") : "\u2014";
          return (
            <div key={n} title={`${f ? f.a : n}: ${val}`}
                 style={{ ...TB_CELL, flex: `${HEADER_WEIGHT[n] || 1} 1 0%` }}>
              <span style={TB_LABEL}>{HEADER_LABEL[n] || (f ? f.a : n)}</span>
              <span style={{ ...TB_VALUE,
                             color: !selectedParent ? "#AAB6C3" : isFlagged(selectedParent) ? FLAG_RED : "#1B2735",
                             fontVariantNumeric: isNumericType(f?.y) ? "tabular-nums" : "normal" }}>{val}</span>
            </div>
          );
        })}

        <div style={{ ...TB_CELL, flex: "0 0 132px", gap: 4, borderRight: "none",
                      background: "#F7F9FC", justifyContent: "flex-end" }}>
          <button title="Previous tract  (Alt + \u2191)" disabled={cycleTracts.length < 2}
            onClick={() => step(-1)} style={stepBtn(cycleTracts.length < 2)}>{"\u2039"}</button>
          <span className="tnum" style={{ fontSize: 11.5, color: "#6B7B8D", minWidth: 52,
                                          textAlign: "center", flex: "0 0 auto" }}>
            {cycleIdx >= 0 ? `${cycleIdx + 1} of ${cycleTracts.length}` : `\u2014 of ${cycleTracts.length}`}
          </span>
          <button title="Next tract  (Alt + \u2193)" disabled={cycleTracts.length < 2}
            onClick={() => step(1)} style={stepBtn(cycleTracts.length < 2)}>{"\u203A"}</button>
        </div>
      </section>

      <nav className="nav" style={BAR_NAV}>
        <span className="navcap" style={NAV_CAP}>Grids</span>
        {GRIDS.map((g) => (
          <button key={g.key}
            style={navBtnStyle(view.type === "grid" && view.key === g.key)}
            onClick={() => { setView({ type: "grid", key: g.key }); setSort({ col: null, dir: 1 }); setFilters({}); }}>
            {g.label}
          </button>
        ))}
        <span className="navdiv" style={{ width: 1, height: 18, background: "#3C6091", margin: "0 10px", flex: "0 0 auto" }} />
        <span className="navcap" style={NAV_CAP}>Views</span>
        <button style={navBtnStyle(view.type === "form", !selectedParent)} disabled={!selectedParent}
          title={selectedParent ? "Edit the selected tract field by field" : "Select a tract first \u2014 click any row, or use the arrows in the header."}
          onClick={() => setView({ type: "form" })}>Tract form</button>
        <button style={navBtnStyle(view.type === "owners")} onClick={() => setView({ type: "owners" })}>Owner list</button>
        <button style={navBtnStyle(view.type === "fields")} onClick={() => setView({ type: "fields" })}>Fields</button>
      </nav>

      <div className="toolbar" style={BAR_TOOL}>
        <button className="btn solid" onClick={() => setModal({ type: "addtract" })}>Add tract</button>
        <button className="btn ghost" disabled={!ownerEligible.length}
          title={ownerEligible.length ? "Add an ownership interest to a tract" : "No tract can take owners yet. Permits and encroachments do not have them."}
          onClick={() => setModal({ type: "addowner" })}>Add owner</button>

        <Switch on={onlineOnly} onToggle={() => setOnlineOnly((v) => !v)} label="Online only"
          title={onlineOnly ? "Showing online tracts only. Switch off to include offline tracts."
                            : "Showing online and offline tracts."} />

        <RowTypeFilter kinds={rowKinds} available={kindsHere} onToggle={toggleKind}
          lockedTo={liveKinds.filter((k) => rowKinds[k]).length <= 1 ? liveKinds.filter((k) => rowKinds[k])[0] : null} />

        <span className="spacer" />
        {view.type === "grid" && (
          <>
            <span className="rowcount tnum">
              {visibleRows.length}{visibleRows.length !== baseRows.length ? ` of ${baseRows.length}` : ""} rows
              {onlineOnly && baseRows.length - visibleRows.length > 0 ? " \u00B7 offline hidden" : ""}
              {liveKinds.filter((k) => !rowKinds[k]).length
                ? ` \u00B7 ${liveKinds.filter((k) => !rowKinds[k]).join(" and ")} rows hidden` : ""}
            </span>
            <input className="searchbox" placeholder="Search every field" value={search} onChange={(e) => setSearch(e.target.value)} />
            <button className={`btn ghost ${showFilters ? "on" : ""}`} onClick={() => setShowFilters((s) => !s)}>Filters</button>
            <button className="btn ghost" onClick={() => setModal({ type: "columns" })}>Columns</button>
            {(search || Object.values(filters).some(Boolean)) && (
              <button className="btn link" onClick={() => { setSearch(""); setFilters({}); }}>Clear</button>
            )}
          </>
        )}
      </div>

      <main className="stage" style={STAGE}>
        {view.type === "grid" && (
          rows.length === 0
            ? <EmptyState onAdd={() => setModal({ type: "addtract" })} onImport={() => fileRef.current?.click()} />
            : <GridView
                key={activeGrid ? activeGrid.key : "grid"}
                cols={cols} rows={visibleRows} sort={sort} setSort={setSort}
                showFilters={showFilters} filters={filters} setFilters={setFilters}
                setCell={setCell} selected={selected} onSelect={selectFromRow}
                onDelete={(r) => setModal({ type: "confirmDelete", row: r })}
                onOpenForm={openForm}
                focusTract={selected} focusTick={focusTick}
                ov={ov} parentIds={parentIds}
              />
        )}

        {view.type === "form" && !selectedParent && (
          <div className="notice pad">No tract selected. Pick one from any grid, then come back to the form.</div>
        )}

        {view.type === "form" && selectedParent && (
          <FormView
            tabs={formTabs} tab={formTab} setTab={setFormTab}
            side={formSide} setSide={setFormSide}
            parent={selectedParent} owners={selectedOwners} row={formRow}
            allFields={allFields} setCell={setCell} ov={ov} parentIds={parentIds}
          />
        )}

        {view.type === "owners" && (
          <OwnersView groups={ownerGroups} fields={OWNER_BULK} fieldByName={fieldByName} onSave={bulkUpdateOwner} />
        )}

        {view.type === "fields" && (
          <FieldsView
            fields={allFields}
            onAdd={() => setModal({ type: "addfield" })}
            onDelete={(n) => { setCustomFields((p) => p.filter((f) => f.n !== n)); notify(`Field ${n} removed.`); }}
          />
        )}
      </main>

      {modal && (
        <Modals
          modal={modal} close={() => setModal(null)}
          fieldByName={fieldByName} parentIds={parentIds} parentRows={parentRows} ownerEligible={ownerEligible}
          allCols={allCols} hiddenSet={hiddenSet} gridKey={activeGrid?.key}
          setHidden={setHidden}
          onAddTract={addTract} onAddOwner={addOwner} nextOwnerId={nextOwnerId}
          onDelete={deleteRow} onImport={doImport} onDownload={exportXlsx} onAskDownload={askDownload}
          onAddField={(f) => {
            if (fieldByName[f.n]) { notify(`A field named ${f.n} already exists.`); return; }
            const withId = { ...f, i: 90000 + customFields.length + 1, custom: true };
            setCustomFields((p) => [...p, withId]);
            setRows((prev) => prev.map((r) => ({ ...r, [f.n]: "" })));
            setModal(null);
            notify(`Field ${f.a} added.`);
          }}
        />
      )}

      {toast && <div className="toast" role="status">{toast}</div>}
    </div>
  );
}


/* ========================= SWITCH ========================= */
function Switch({ on, onToggle, label, title, disabled }) {
  const live = on && !disabled;
  return (
    <button role="switch" aria-checked={!!on} aria-disabled={!!disabled} title={title}
      onClick={() => { if (!disabled) onToggle(); }}
      style={{ display: "flex", alignItems: "center", gap: 8, marginLeft: 6, padding: "4px 10px 4px 6px",
               height: 28, borderRadius: 3, font: "inherit", fontSize: 12.5, fontWeight: 500,
               whiteSpace: "nowrap", cursor: disabled ? "not-allowed" : "pointer",
               background: disabled ? "#F1F4F8" : live ? "#E7F0FA" : "#FFFFFF",
               border: `1px solid ${disabled ? "#E1E6EC" : live ? "#1F6FBF" : "#D4DBE4"}`,
               color: disabled ? "#A6B1BD" : live ? "#17579A" : "#48586B" }}>
      <span style={{ position: "relative", width: 30, height: 16, borderRadius: 8, flex: "0 0 auto",
                     background: disabled ? "#D8DEE5" : live ? "#1F6FBF" : "#B7C3D0", transition: "background .12s" }}>
        <span style={{ position: "absolute", top: 2, left: on ? 16 : 2, width: 12, height: 12,
                       borderRadius: 6, background: "#fff", transition: "left .12s" }} />
      </span>
      {label}
    </button>
  );
}

/* ========================= ROW TYPE FILTER ========================= */
