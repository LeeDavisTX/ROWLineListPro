/* ========================= DERIVE ENGINE ========================= */
/* Recomputes copy-down, owner counts, parent sums, and cost-per-rod.
   A cell the user has typed into is in `ov` and is left alone. */
const ovKey = (id, n) => `${id}::${n}`;
function derive(rows, ov) {
    const out = rows.map((r) => ({ ...r }));
    const parents = out.filter((r) => !isOwnerRow(r));
    const byTractId = new Map();
    parents.forEach((p) => { if (p.TractID)
        byTractId.set(String(p.TractID), p); });
    const kids = new Map();
    out.forEach((r) => {
        if (!isOwnerRow(r))
            return;
        const k = String(r.ParentID || "");
        if (!kids.has(k))
            kids.set(k, []);
        kids.get(k).push(r);
    });
    parents.forEach((p) => {
        const owners = kids.get(String(p.TractID)) || [];
        // copy down tract-level facts
        owners.forEach((o) => { COPY_DOWN.forEach((n) => { o[n] = p[n] ?? ""; }); });
        // owner count is the row count, full stop — it is how the app tells a
        // single-owner tract from a multi-owner one, so it cannot be overridden
        p.OwnerCount = takesOwners(p) ? owners.length : "";
        // parent currency roll-up
        if (owners.length) {
            PARENT_SUM.forEach((n) => {
                if (ov.has(ovKey(p._id, n)))
                    return;
                let any = false, sum = 0;
                owners.forEach((o) => { const v = num(o[n]); if (v !== null) {
                    any = true;
                    sum += v;
                } });
                if (any)
                    p[n] = round(sum, 2);
            });
        }
    });
    // cost per rod, every row
    out.forEach((r) => {
        const rods = num(r.Rods);
        Object.entries(PER_ROD).forEach(([per, amt]) => {
            if (ov.has(ovKey(r._id, per)))
                return;
            const a = num(r[amt]);
            r[per] = a !== null && rods ? round(a / rods, 2) : "";
        });
    });
    // Re-seat every owner row beneath its parent. Without this, reassigning a
    // ParentID leaves the row sitting next to the tract it used to belong to.
    const ordVal = (r) => { const n = num(r.Order); return n === null ? Infinity : n; }; // blanks last
    const byId = (a, b) => String(a.TractID ?? "").localeCompare(String(b.TractID ?? ""), undefined, { numeric: true });
    /* Order is user-set and need not be unique, so SysID breaks the tie and
       carries the blanks. It is sequential, so this is creation order. */
    const bySys = (a, b) => String(a.SysID ?? "").localeCompare(String(b.SysID ?? ""));
    const ordered = [];
    const placed = new Set();
    [...parents].sort((a, b) => (ordVal(a) - ordVal(b)) || bySys(a, b)).forEach((p) => {
        ordered.push(p);
        placed.add(p._id);
        [...(kids.get(String(p.TractID)) || [])].sort(byId).forEach((o) => { ordered.push(o); placed.add(o._id); });
    });
    out.forEach((r) => { if (!placed.has(r._id))
        ordered.push(r); }); // owners with no parent
    return ordered;
}
/* Feet / Rods / Miles are conversions of one another; editing any one
   rewrites the other two on that row. */
function applyLengthConversion(row, field, value) {
    const v = num(value);
    if (v === null)
        return;
    if (field === "Feet") {
        row.Rods = round(v / 16.5, 2);
        row.Miles = round(v / 5280, 4);
    }
    if (field === "Rods") {
        row.Feet = round(v * 16.5, 2);
        row.Miles = round((v * 16.5) / 5280, 4);
    }
    if (field === "Miles") {
        row.Feet = round(v * 5280, 2);
        row.Rods = round((v * 5280) / 16.5, 2);
    }
}
/* ========================= ROW VISIBILITY PER GRID ========================= */
function gridRows(key, rows) {
    switch (key) {
        // Tract and Cost show every row. Crossing rows (Permit, Encroachment) are
        // limited to Tract, Location, Crossings and Cost.
        case "tract": return rows;
        case "cost": return rows;
        case "cross": return rows.filter((r) => !isOwnerRow(r) && hasCrossing(r));
        // Location is a tract-level record, and a crossing has a location like any
        // other tract, so every non-owner row appears here.
        case "loc": return rows.filter((r) => !isOwnerRow(r));
        // The Owner grid is the landowner record and nothing else: the owner rows
        // themselves, plus the parent tracts they hang from. Types that hold no
        // owners are left off entirely rather than shown with an empty count.
        case "owner": return rows.filter((r) => isOwnerRow(r) || takesOwners(r));
        case "title":
        case "acq":
        case "legal": return rows.filter((r) => !isPermitRow(r));
        // Field Survey, Plat, Construction, Operations are parent-tract records.
        default: return rows.filter((r) => !isOwnerRow(r) && !isPermitRow(r));
    }
}
/* Probe gridRows rather than maintaining a parallel list, so the row-type
   filter always agrees with what a grid actually shows. */
const KIND_PROBE = [
    { _id: "p", TractID: "p", TractType: "Parent" },
    { _id: "e", TractID: "e", TractType: "Exclusive Easement" }, // parent kind, but crosses
    { _id: "o", TractID: "o", TractType: "Owner", ParentID: "p" },
    { _id: "m", TractID: "m", TractType: "Permit" },
    { _id: "n", TractID: "n", TractType: "Encroachment" },
];
const rowKind = (r) => (isOwnerRow(r) ? "owner" : isPermitRow(r) ? "permit" : "parent");
function gridKinds(key) {
    const r = gridRows(key, KIND_PROBE).map((x) => x._id);
    return {
        parent: r.includes("p") || r.includes("e"),
        owner: r.includes("o"),
        permit: r.includes("m") || r.includes("n"),
    };
}

/* ========================= STYLES ========================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

.rlp{
  --navy:#12325C; --navy2:#1B4477; --navy3:#28558C;
  --blue:#1F6FBF; --blue2:#17579A; --blue-pale:#E7F0FA; --blue-line:#B8D2EC;
  --bg:#F4F6F9; --paper:#FFFFFF;
  --rule:#D4DBE4; --rule2:#E7ECF2;
  --text:#1B2735; --mid:#48586B; --dim:#6B7B8D;
  --sel:#E7F0FA; --calc:#F2F6FB; --calcline:#9EBFDF;
  --danger:#B33A2B;
  position:fixed; inset:0; display:flex; flex-direction:column;
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,sans-serif; font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.rlp *{box-sizing:border-box}
.rlp button{font:inherit; color:inherit; cursor:pointer}
.rlp input,.rlp select,.rlp textarea{font:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11.5px}
.dim{color:var(--dim)}
.spacer{flex:1}
.rlp :focus-visible{outline:2px solid var(--blue); outline-offset:1px}

/* ---------- topbar ---------- */
.topbar{display:flex; align-items:center; gap:20px; padding:0 16px; height:56px;
  background:var(--navy); color:#F2F5F9; flex:0 0 auto}
.brand{display:flex; align-items:baseline; gap:8px; flex:0 0 auto}
.mark{font-weight:700; letter-spacing:.14em; font-size:12px; color:#BBD4EE;
  border:1px solid #3C6091; padding:3px 6px; border-radius:2px}
.wordmark{font-weight:600; font-size:14px; letter-spacing:-.01em}
.wordmark em{font-style:normal; color:#9FC2E5; font-weight:500}

.projstrip{display:flex; gap:10px; flex:1; min-width:0; overflow-x:auto}
.projfield{display:flex; flex-direction:column; gap:2px; min-width:118px}
.projfield span{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:#A8C0DA}
.projfield input,.projfield select{background:#FFFFFF; border:1px solid #9FB6CE; border-radius:3px;
  color:#16233A; padding:3px 6px; height:24px; width:100%}
.projfield input:focus,.projfield select:focus{border-color:#fff}

.topactions{display:flex; gap:8px; flex:0 0 auto}

/* ---------- buttons ---------- */
.btn{border:1px solid transparent; border-radius:3px; padding:5px 12px; height:28px;
  font-size:12.5px; font-weight:500; white-space:nowrap}
.btn.pale{background:#E9EFF6; color:#153458; border-color:#B7C8DA}
.btn.pale:hover{background:#FFFFFF}
.btn.solid{background:var(--blue); color:#fff}
.btn.solid:hover{background:var(--blue2)}
.btn.solid:disabled{background:#AEBCCB; cursor:not-allowed}
.btn.ghost{background:var(--paper); border-color:var(--rule); color:var(--mid)}
.btn.ghost:hover{border-color:#A9BACB; color:var(--text)}
.btn.ghost.on{background:var(--blue-pale); border-color:var(--blue); color:var(--blue2)}
.btn.ghost:disabled{color:#A6B1BD; cursor:not-allowed; background:#EDF0F4}
.btn.link{background:none; color:var(--mid); padding:5px 8px}
.btn.link:hover{color:var(--text); text-decoration:underline}
.btn.danger{background:var(--danger); color:#fff}

/* ---------- tract header strip (single horizontal row, never wraps) ---------- */
.titleblock{
  background:var(--paper); border-bottom:1px solid var(--rule);
  border-top:2px solid var(--navy); flex:0 0 auto; height:44px; overflow:hidden;
}
.tbcell{
  gap:7px; padding:0 12px; height:44px; line-height:44px;
  border-right:1px solid var(--rule2); white-space:nowrap; overflow:hidden;
}
.tbcell:last-child{border-right:none}
.tbcount{background:#F7F9FC}
.tblabel{flex:0 0 auto; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.tbvalue{flex:1 1 auto; min-width:0; font-size:13px; font-weight:600; color:var(--text);
  overflow:hidden; text-overflow:ellipsis}
.titleblock.empty .tbvalue{color:#AAB6C3; font-weight:500}

/* ---------- nav ---------- */
.nav{display:flex; align-items:center; gap:2px; padding:0 12px; height:40px;
  background:var(--navy2); overflow-x:auto; flex:0 0 auto}
.navcap{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#B9D4EE;
  margin-right:8px; flex:0 0 auto; font-weight:600}
.navdiv{width:1px; height:18px; background:#3C6091; margin:0 10px; flex:0 0 auto}
.navbtn{background:none; border:none; color:#FFFFFF; padding:6px 11px; border-radius:3px;
  font-size:13px; font-weight:500; white-space:nowrap; flex:0 0 auto}
.navbtn:hover{background:var(--navy3); color:#FFFFFF}
.navbtn.on{background:var(--paper); color:var(--navy); font-weight:600}
.navbtn:disabled{color:#8FAAC6; cursor:not-allowed; background:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid var(--rule); flex:0 0 auto}
.rowcount{font-size:11.5px; color:var(--dim)}
.searchbox{background:var(--paper); border:1px solid var(--rule); border-radius:3px;
  padding:4px 9px; height:28px; width:220px}
.searchbox:focus{border-color:var(--blue)}

/* ---------- stage ---------- */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}

/* ---------- grid ---------- */
.gridwrap{flex:1 1 auto; min-height:0; overflow:auto; position:relative; background:var(--paper)}
/* the header must be the only thing pinned while the body scrolls under it */
.grid thead{position:sticky; top:0; z-index:6}
.grid{border-collapse:separate; border-spacing:0; table-layout:fixed}
.grid th{position:sticky; top:0; z-index:3; background:#EDF1F6; text-align:left;
  box-sizing:border-box; padding:0 8px; height:30px; font-size:10.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:var(--navy);
  border-right:1px solid var(--rule2); border-bottom:1px solid var(--rule);
  cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; vertical-align:middle}
/* numeric columns are right-aligned in the body, so their headers are too */
.grid th.numhead{text-align:right}
.grid th.numhead .thlabel{float:none}
.grid th:hover{background:#E2E9F2}
.thlabel{display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom}
.sortmark{margin-left:4px; color:var(--blue)}
.grid th.stick,.grid td.stick{position:sticky; left:0; z-index:2}
.grid th.stick{z-index:4}
.grid td.stick{background:var(--paper); border-right:1px solid var(--rule)}
.grid tr.sel td.stick{background:var(--sel)}
.grid tr.ownerrow td.stick{background:#EFF3F8}
.grid tr.permitrow td.stick{background:#FAF0EF}
.grid tr.sel.ownerrow td.stick,.grid tr.sel.permitrow td.stick{background:var(--sel)}
.filterrow th{top:30px; z-index:3; background:#F6F8FB; padding:2px 3px; height:28px; cursor:default}
.filterrow input{width:100%; height:22px; border:1px solid var(--rule2); border-radius:2px;
  padding:0 5px; font-size:11.5px; background:#fff}
.thend{width:72px; cursor:default}

.grid td{box-sizing:border-box; height:${ROW_H}px; padding:0; border-right:1px solid #EFF2F6;
  border-bottom:1px solid #EFF2F6; overflow:hidden; vertical-align:middle}
/* Row shading carries the row's role: owner rows a step of grey-blue,
   crossing tracts (Permit, Encroachment) a faded maroon. Exclusive Easement
   is an ordinary parent tract, so it stays white. Hover keeps each hue. */
.grid tr.ownerrow{background:#EFF3F8}
.grid tr.permitrow{background:#FAF0EF}
.grid tr.sel{background:var(--sel)}
.grid tr:hover td{background:#F3F7FC}
.grid tr.ownerrow:hover td{background:#E6ECF4}
.grid tr.permitrow:hover td{background:#F5E4E2}
.grid tr.sel:hover td{background:#DCEAF8}
.grid tr.sel.ownerrow:hover td,.grid tr.sel.permitrow:hover td{background:#DCEAF8}

.cell{display:block; box-sizing:border-box; width:100%; height:${ROW_H - 2}px;
  border:none; background:transparent; padding:0 8px; font-size:12.5px; margin:0}
.cell:focus{background:#fff; box-shadow:inset 0 0 0 2px var(--blue); border-radius:2px}
.cell.num{text-align:right}
.cell.calc{background:var(--calc); box-shadow:inset 0 -2px 0 var(--calcline)}
.cell.ro{display:flex; align-items:center; color:var(--dim); font-size:12px}
select.cell{appearance:none; cursor:pointer}
.rowend{text-align:center; background:var(--paper); white-space:nowrap; padding:0 2px}
.openform{background:none; border:1px solid var(--rule); border-radius:3px; color:var(--blue2);
  font-size:11px; font-weight:600; padding:2px 6px; margin-right:2px}
.openform:hover{background:var(--blue-pale); border-color:var(--blue)}
.del{background:none; border:none; color:#AFBAC6; font-size:16px; line-height:1; padding:2px 6px; border-radius:3px}
.del:hover{color:var(--danger); background:#F8EAE7}

/* ---------- empty ---------- */
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:40px}
.emptyrule{width:56px; height:2px; background:var(--blue)}
.empty h2{margin:0; font-size:18px; font-weight:600}
.empty p{margin:0; max-width:420px; color:var(--mid)}
.emptyactions{display:flex; gap:8px; margin-top:8px}

/* ---------- form ---------- */
.form{flex:1; min-height:0; display:flex; overflow:hidden}
.formside{flex:0 0 210px; border-right:1px solid var(--rule); background:#F7F9FC; overflow:auto; padding:8px}
.sidebtn{display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  background:none; border:1px solid transparent; border-radius:4px; padding:7px 9px; margin-bottom:3px}
.sidebtn:hover{background:#EBF1F8}
.sidebtn.on{background:var(--paper); border-color:var(--blue); box-shadow:0 1px 2px rgba(18,50,92,.10)}
.sidecap{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.sideval{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.formmain{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.formtabs{display:flex; gap:2px; padding:8px 14px 0; overflow-x:auto;
  border-bottom:1px solid var(--rule); background:#F7F9FC; flex:0 0 auto}
.ftab{background:none; border:none; border-bottom:3px solid transparent; padding:7px 12px;
  font-size:12.5px; font-weight:500; color:var(--mid); white-space:nowrap; flex:0 0 auto}
.ftab:hover{color:var(--navy); background:#EBF1F8}
.ftab.on{color:var(--navy); font-weight:700; border-bottom-color:var(--blue); background:var(--paper)}

.fieldgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px 16px;
  padding:16px; overflow:auto}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field.wide{grid-column:1/-1}
.flabel{display:flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mid); font-weight:600}
.autotag{font-style:normal; font-size:9px; letter-spacing:.08em; color:var(--blue2);
  background:var(--calc); border:1px solid var(--calcline); border-radius:2px; padding:0 4px}
.req{font-style:normal; font-size:9px; letter-spacing:.06em; color:var(--danger)}
.field .cell{height:30px; border:1px solid var(--rule); border-radius:3px; background:var(--paper)}
.field textarea.cell{height:auto; padding:6px 8px; resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:3px 10px;
  font-size:12px; color:var(--mid)}
.chip.on{background:var(--blue-pale); border-color:var(--blue); color:var(--blue2); font-weight:600}

.notice{padding:14px 16px; color:var(--mid); background:#F7F9FC;
  border:1px dashed var(--rule); border-radius:4px; margin:16px}
.notice.pad{margin:24px}

/* ---------- owner list ---------- */
.ownerlist{flex:1; overflow:auto; padding:16px 18px}
.lede{margin:0 0 14px; color:var(--mid); max-width:620px}
.ownercard{background:var(--paper); border:1px solid var(--rule2); border-radius:4px; margin-bottom:6px}
.ownercard.open{border-color:var(--blue)}
.ownerhead{display:flex; align-items:baseline; gap:14px; width:100%; text-align:left;
  background:none; border:none; padding:10px 14px}
.ownername{font-weight:600; font-size:13.5px}
.ownermeta{font-size:11.5px; color:var(--dim); flex:0 0 auto}
.ownertracts{font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ownerbody{border-top:1px solid var(--rule2)}
.ownerfoot{display:flex; gap:8px; align-items:center; padding:0 16px 14px}

/* ---------- fields view ---------- */
.fieldsview{flex:1; min-height:0; display:flex; flex-direction:column}
.fieldsbar{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule)}
.fieldstable{width:100%; table-layout:auto}
.fieldstable td{height:28px}
.pad6{padding:0 10px; font-size:12.5px}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(18,50,92,.42); display:flex;
  align-items:center; justify-content:center; padding:24px; z-index:50}
.sheet{background:var(--paper); border-radius:5px; width:min(640px,100%); max-height:88vh;
  overflow:auto; box-shadow:0 18px 48px rgba(18,50,92,.30); border-top:3px solid var(--blue)}
.sheet h3{margin:0; padding:16px 18px 4px; font-size:16px; font-weight:600; color:var(--navy)}
.sheetlede{margin:0; padding:0 18px; color:var(--mid)}
.sheet .fieldgrid{padding:14px 18px}
.sheetfoot{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px 16px;
  border-top:1px solid var(--rule2)}
.warn{margin:0 18px; padding:8px 10px; background:#FAEDEA; border-left:3px solid var(--danger);
  color:#8E2E22; font-size:12.5px; border-radius:2px}
.collist{padding:12px 18px; max-height:46vh; overflow:auto}
.colrow{display:flex; align-items:center; gap:9px; padding:4px 0}
.colrow em{margin-left:auto; font-style:normal}

/* ---------- admin ---------- */
.adview{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.adbar{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; padding:12px 16px;
  background:var(--paper); border-bottom:1px solid var(--rule); flex:0 0 auto}
.admeta{font-size:11.5px; color:var(--dim)}
.adscroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 28px; max-width:820px}
.adhead{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.adhead h4{margin:0; font-size:14px; color:var(--navy)}
.adlede{margin:0 0 14px; font-size:12px; color:var(--dim); line-height:1.5; max-width:74ch}

.adlist{list-style:none; margin:0 0 14px; padding:0; border:1px solid var(--rule);
  border-radius:4px; background:var(--paper); overflow:hidden}
.aditem{display:flex; align-items:center; gap:9px; padding:6px 11px;
  border-bottom:1px solid var(--rule)}
.aditem:last-child{border-bottom:none}
.aditem:nth-child(even){background:#FAFBFD}
.aditem .btn.link{padding:2px 6px; height:auto; font-size:11.5px}
.aditem .cell{flex:1 1 auto; height:26px; border:1px solid var(--blue);
  border-radius:3px; padding:3px 7px; min-width:0}
.adord{width:20px; flex:0 0 20px; font-size:10.5px; color:#93A2B2; text-align:right}
.adval{font-size:13px; color:var(--text)}

.adadd{display:flex; gap:8px; align-items:center; max-width:460px}
.adadd .cell{flex:1 1 auto; height:30px; border:1px solid #C3CDD9; border-radius:3px;
  padding:5px 8px; background:var(--paper); min-width:0}
.adadd .cell:focus{border-color:var(--blue)}

@media (max-width:900px){
  .aditem{flex-wrap:wrap}
  .adscroll{max-width:none}
}

/* ---------- contact notes ---------- */
.cnview{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.cnbar{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; padding:12px 16px;
  background:var(--paper); border-bottom:1px solid var(--rule); flex:0 0 auto}
.cnf{display:flex; flex-direction:column; gap:3px; min-width:0}
.cnf > span{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.cnf .cell{border:1px solid #C3CDD9; border-radius:3px; background:var(--paper);
  padding:4px 7px; height:28px; width:100%}
.cnf .cell:focus{border-color:var(--blue)}
.cnactions{flex-direction:row; align-items:center; gap:6px; margin-left:auto}

.cnscroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 28px}
.cncount{font-size:11.5px; color:var(--dim); margin:0 0 10px 2px}
.cnscroll .notice{border:1px dashed var(--rule); border-radius:4px; text-align:center}

/* Day rule. Sticky so the date stays readable while scrolling a long feed. */
.cnday{margin-bottom:16px}
.cndate{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:9px;
  margin:0 0 8px; padding:5px 2px; background:var(--bg);
  font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--navy); border-bottom:1px solid var(--blue-line)}
.cndaycount{margin-left:auto; font-weight:500; letter-spacing:0; color:var(--dim);
  font-size:10.5px}

.cnentry{background:var(--paper); border:1px solid var(--rule);
  border-left:3px solid var(--navy2); border-radius:4px; padding:10px 13px; margin-bottom:8px}
.cnhead{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:5px}
.cnhead .btn.link{padding:2px 6px; height:auto; font-size:11.5px}
.cntract{font-weight:700; font-size:13.5px; color:var(--navy); letter-spacing:-.01em}
.cnname{font-size:12.5px; color:var(--mid)}
.cnsub{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:7px}
.cnparty{font-size:12.5px; color:var(--text)}
.cnmeta{font-size:11.5px; color:var(--dim)}
.cnid{font-size:10.5px; color:#93A2B2}
.cntag{background:var(--blue-pale); border:1px solid var(--blue-line); color:var(--blue2);
  border-radius:2px; padding:1px 6px; font-size:9.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
.cntag.warn{background:#FBF0D8; border-color:#E3C583; color:#7A5600}
.cnbody{margin:0; white-space:pre-wrap; line-height:1.5; color:var(--text); max-width:104ch}

.cnediting{border-left-color:#C98A1A; background:#FBFCFE}
.cnform{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px}
.cnnote{margin-bottom:10px}
.cnnote textarea{min-height:82px; resize:vertical; line-height:1.5; padding:7px}
.cnfoot{display:flex; align-items:center; gap:8px}

@media (max-width:900px){
  .cnactions{margin-left:0}
  .cnbody{max-width:none}
}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  background:var(--navy); color:#F2F5F9; padding:10px 16px; border-radius:4px;
  box-shadow:0 8px 22px rgba(18,50,92,.30); max-width:640px; z-index:60; font-size:12.5px}

@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}
}
@media (max-width:1100px){
  .titleblock{overflow-x:auto}
}
@media (max-width:900px){
  .projstrip{display:none}
  .formside{flex-basis:150px}
}
