/* A running log, one entry per contact, anchored to a parent tract. This sits
   outside the flat line list on purpose: a tract collects many contacts over
   the life of a project and the schema has no repeating group to hold them.
   Notes carry no schema field IDs and are exported to their own sheet. */
const CONTACT_SHEET = "Contact Notes";
const CONTACT_METHODS = [
    "Phone - Outbound", "Phone - Inbound", "Email", "Text/SMS", "In-Person Meeting",
    "Door Knock", "Mail - Certified", "Mail - Regular", "Voicemail Left", "Other",
];
const CONTACT_OUTCOMES = [
    "Contact Made", "No Answer", "Left Message", "Refused Contact",
    "Offer Presented", "Counteroffer Received", "Negotiating", "Agreement Reached",
    "Referred to Attorney", "Referred to Condemnation", "Wrong Contact Info",
    "Deceased/Estate", "Other",
];
/* Fixed columns, in export order. Not schema driven, so a schema bump leaves
   the contact log alone. */
const NOTE_COLS = [
    { k: "NoteID", a: "Note ID", w: 11 },
    { k: "TractID", a: "Tract ID", w: 22 },
    { k: "PartyName", a: "Party Name", w: 26 },
    { k: "ContactDate", a: "Contact Date", w: 13 },
    { k: "ContactTime", a: "Contact Time", w: 12 },
    { k: "ContactMethod", a: "Contact Method", w: 20 },
    { k: "Outcome", a: "Outcome", w: 24 },
    { k: "Author", a: "Author", w: 10 },
    { k: "NoteText", a: "Note", w: 90 },
];
const NOTE_ALIAS_TO_KEY = Object.fromEntries(NOTE_COLS.flatMap((c) => [[c.a.toLowerCase(), c.k], [c.k.toLowerCase(), c.k]]));
const pad2 = (n) => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const nowHHMM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
/* Excel hands back a time-only cell as a fraction of a day. */
const toHHMM = (v) => {
    if (v === "" || v === null || v === undefined)
        return "";
    if (typeof v === "number") {
        const mins = Math.round((v - Math.floor(v)) * 1440);
        return `${pad2(Math.floor(mins / 60) % 24)}:${pad2(mins % 60)}`;
    }
    const m = /^(\d{1,2}):(\d{2})/.exec(String(v).trim());
    return m ? `${pad2(m[1])}:${m[2]}` : String(v).trim();
};
const nextNoteId = (notes) => {
    let max = 0;
    notes.forEach((n) => { const m = /(\d+)\s*$/.exec(String(n.NoteID || "")); if (m)
        max = Math.max(max, parseInt(m[1], 10)); });
    return `CN-${String(max + 1).padStart(4, "0")}`;
};
const blankNote = (notes, tractId, author) => ({
    NoteID: nextNoteId(notes),
    TractID: tractId || "",
    PartyName: "",
    ContactDate: todayISO(),
    ContactTime: nowHHMM(),
    ContactMethod: "",
    Outcome: "",
    Author: author || "",
    NoteText: "",
});
/* Newest first, time breaking the tie within a day. */
const noteOrder = (n) => `${n.ContactDate || "0000-00-00"} ${n.ContactTime || "00:00"}`;
const sortNotes = (notes) => notes.slice().sort((a, b) => {
    const ka = noteOrder(a), kb = noteOrder(b);
    return ka === kb ? String(b.NoteID).localeCompare(String(a.NoteID)) : kb.localeCompare(ka);
});

/* Recomputes copy-down, owner counts, parent sums, and cost-per-rod.
   A cell the user has typed into is in `ov` and is left alone. */
const ovKey = (id, n) => `${id}::${n}`;

    const byTractId = new Map();
    parents.forEach((p) => { if (p.TractID)
        byTractId.set(String(p.TractID), p); });
    const kids = new Map();
    out.forEach((r) => {
        if (!isOwnerRow(r))
            return;
        const k = String(r.ParentID || "");
        if (!kids.has(k))
            kids.set(k, []);
        kids.get(k).push(r);

    parents.forEach((p) => {
        const owners = kids.get(String(p.TractID)) || [];
        // copy down tract-level facts
        owners.forEach((o) => { COPY_DOWN.forEach((n) => { o[n] = p[n] ?? ""; }); });

        // single-owner tract from a multi-owner one, so it cannot be overridden

        if (owners.length) {
            PARENT_SUM.forEach((n) => {

                    return;

                    any = true;
                    sum += v;

                if (any)
                    p[n] = round(sum, 2);

        }

    out.forEach((r) => {
        const rods = num(r.Rods);
        Object.entries(PER_ROD).forEach(([per, amt]) => {
            if (ov.has(ovKey(r._id, per)))
                return;

    const ordVal = (r) => { const n = num(r.Order); return n === null ? Infinity : n; }; // blanks last

    [...parents].sort((a, b) => (ordVal(a) - ordVal(b)) || bySys(a, b)).forEach((p) => {

        [...(kids.get(String(p.TractID)) || [])].sort(byId).forEach((o) => { ordered.push(o); placed.add(o._id); });

        row.Miles = round((v * 16.5) / 5280, 4);

function gridRows(key, rows) {
    switch (key) {

        // limited to Tract, Location, Crossings and Cost.
        case "tract": return rows;
        case "cost": return rows;
        case "cross": return rows.filter((r) => !isOwnerRow(r) && hasCrossing(r));
        // Location is a tract-level record, and a crossing has a location like any
        // other tract, so every non-owner row appears here.
        case "loc": return rows.filter((r) => !isOwnerRow(r));
        // The Owner grid is the landowner record and nothing else: the owner rows
        // themselves, plus the parent tracts they hang from. Types that hold no
        // owners are left off entirely rather than shown with an empty count.
        case "owner": return rows.filter((r) => isOwnerRow(r) || takesOwners(r));
        case "title":
        case "acq":
        case "legal": return rows.filter((r) => !isPermitRow(r));

        default: return rows.filter((r) => !isOwnerRow(r) && !isPermitRow(r));

    { _id: "o", TractID: "o", TractType: "Owner", ParentID: "p" },
    { _id: "m", TractID: "m", TractType: "Permit" },
    { _id: "n", TractID: "n", TractType: "Encroachment" },

        owner: r.includes("o"),
        permit: r.includes("m") || r.includes("n"),

}

                    return ((num(av) ?? -Infinity) - (num(bv) ?? -Infinity)) * sort.dir;
                return String(av ?? "").localeCompare(String(bv ?? ""), undefined, { numeric: true }) * sort.dir;

        return out;
    }, [baseRows, onlineOnly, rowKinds, search, filters, sort, fieldByName]);
    /* Permits and encroachments never take owner rows. */
    const ownerEligible = useMemo(() => parentRows.filter((r) => takesOwners(r) && r.TractID), [parentRows]);
    const selectFromRow = (r) => setSelected(isOwnerRow(r) ? String(r.ParentID) : String(r.TractID));
    /* Tracts reachable by the stepper, in the order they appear on screen, so it
       never jumps to something a filter is hiding. Owner rows resolve to their
       parent, which keeps the stepper working in an owner-only view. */
    const cycleTracts = useMemo(() => {
        /* Outside grid view there are no visible rows to walk, so fall back to
           every tract in row order, still honouring the online filter. */
        const source = activeGrid
            ? visibleRows
            : rows.filter((r) => !onlineOnly || String(r.Online || "").trim().toUpperCase() === "Y");
        const seen = new Set();
        const out = [];
        source.forEach((r) => {
            const pid = String(isOwnerRow(r) ? r.ParentID : r.TractID);
            if (!pid || seen.has(pid))
                return;

            out.push(pid);

        return out;

    const cycleIdx = cycleTracts.indexOf(String(selected));
    const step = useCallback((dir) => {
        if (!cycleTracts.length)
            return;

        const next = i === -1 ? (dir > 0 ? 0 : cycleTracts.length - 1)
            : (i + dir + cycleTracts.length) % cycleTracts.length;
        setSelected(cycleTracts[next]);
        setFocusTick((t) => t + 1);
    }, [cycleTracts, selected]);
    /* ========================= EXPORT ========================= */
    /* Suggested name, offered in the download dialog so it can be changed. */
    const suggestedFileName = () => {
        const tag = (project.ProjectNam || project.ProjectID || "Project").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 40);
        return `ROW_LineList_${tag}_${new Date().toISOString().slice(0, 10)}`;
    };
    const askDownload = () => {
        if (!rows.length) {
            notify("Nothing to download yet. Add a tract or import a line list.");
            return;
        }
        setModal({ type: "download", name: suggestedFileName() });
    };
    /* The sample stands in for a real import, so it has to leave the app in the
       same state one does: fresh overrides, derived values recomputed, selection
       on the first tract, and dirty set so the save reminder still fires. */
    const loadSample = () => {
        const fresh = new Set();
        const seeded = SAMPLE.rows.map((r) => ({
            ...Object.fromEntries(allFields.map((f) => [f.n, ""])),
            ...r, _id: uid(),
        }));
        setOv(fresh);
        setRows(derive(seeded, fresh));
        setNotes(SAMPLE.notes.map((x) => ({ ...x })));
        setProject((p) => ({ ...p, ...SAMPLE.project }));
        setSysSeq(seeded.length + 1);
        setFilters({});
        setSearch("");
        setSort({ col: null, dir: 1 });
        setView({ type: "grid", key: "tract" });
        const first = seeded.find((r) => !isOwnerRow(r));
        setSelected(first ? String(first.TractID) : null);
        setDirty(true);
        setModal(null);

            + `Clear it when you are ready to start your own.`);
    };
    /* Clear returns the app to the state it has on a cold load, custom fields and
       Admin list edits included, since a half reset would leave a new project
       carrying settings from the old one. */
    const clearAll = () => {
        setRows([]);
        setNotes([]);
        setOv(new Set());
        setCustomFields([]);
        setListOverrides({});
        setProject(Object.fromEntries(PROJECT_FIELDS.map((x) => [x, ""])));
        setSysSeq(1);
        setSelected(null);
        setFormSide("parent");
        setFormTab("Parent Tract");
        setView({ type: "grid", key: "tract" });
        setSearch("");
        setFilters({});
        setShowFilters(false);
        setSort({ col: null, dir: 1 });
        setHidden({});
        setRowKinds({ parent: true, owner: true, permit: true });
        setOnlineOnly(true);
        setDirty(false);

    };
    const exportXlsx = (fileName) => {
        if (!rows.length) {
            notify("Nothing to download yet. Add a tract or import a line list.");
            return;
        }
        /* Column order matches the schema file row for row, with any custom fields
           appended after the core set. */
        const order = allFields;
        /* Headers are the aliases. Import reads them back through the Fields sheet,
           which carries the alias alongside the ten-character field name. */
        const header = order.map((f) => f.a);
        const data = rows.map((r) => {
            const o = {};
            order.forEach((f) => {
                let v = r[f.n] ?? "";
                if (f.y === "Date" && v)
                    v = fmtDateUS(v);
                else if (isNumericType(f.y) && v !== "") {
                    const n = num(v);
                    v = n === null ? v : n;
                }
                o[f.a] = v;
            });
            return o;
        });
        const wb = XLSX.utils.book_new();
        const ws1 = XLSX.utils.json_to_sheet(data, { header });
        ws1["!cols"] = order.map((f) => ({ wch: Math.max(12, Math.min(34, f.a.length + 2)) }));
        XLSX.utils.book_append_sheet(wb, ws1, "Line List");
        const fieldRows = order.map((f) => {
            const row = { "Field ID": f.i, "Field Name": f.n, "Alias": f.a, "View Tabs": f.t.join(", "), "Field Type": f.y };
            (f.o || []).forEach((opt, i) => (row[`Attribute ${i + 1}`] = opt));
            return row;
        });
        const ws2 = XLSX.utils.json_to_sheet(fieldRows);
        XLSX.utils.book_append_sheet(wb, ws2, "Fields");
        /* Built as an array of arrays rather than json_to_sheet: given an empty
           list json_to_sheet has no keys to work from and drops the header row,
           which leaves a first-time user with a blank sheet and nothing to type
           under. Dates and times go out as text, since an Excel serial coming back
           through a re-import is the usual way a log loses its ordering. */
        const noteAoa = [NOTE_COLS.map((c) => c.a)].concat(sortNotes(notes).map((n) => NOTE_COLS.map((c) => (n[c.k] == null ? "" : String(n[c.k])))));
        const ws3 = XLSX.utils.aoa_to_sheet(noteAoa);
        ws3["!cols"] = NOTE_COLS.map((c) => ({ wch: c.w }));
        ws3["!freeze"] = { xSplit: 0, ySplit: 1 };
        XLSX.utils.book_append_sheet(wb, ws3, CONTACT_SHEET);
        const safe = String(fileName || suggestedFileName())
            .replace(/\.xlsx$/i, "")
            .replace(/[\\/:*?"<>|]+/g, "-") // characters no file system will take
            .trim()
            .slice(0, 120) || suggestedFileName();
        XLSX.writeFile(wb, `${safe}.xlsx`);
        setDirty(false);
        setModal(null);
        notify(`Downloaded ${safe}.xlsx — this is the only copy, the app stores nothing.`);
    };
    /* ========================= IMPORT ========================= */
    const doImport = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: false });
                const added = [];
                const known = new Set(allFields.map((f) => f.n));
                // read a Fields sheet if the file carries one
                const nextLists = {};
                const listChanges = [];
                const fsheet = wb.Sheets["Fields"];
                if (fsheet) {
                    let nextId = 90000 + customFields.length;
                    XLSX.utils.sheet_to_json(fsheet, { defval: "" }).forEach((rec) => {
                        const n = String(rec["Field Name"] || "").trim();
                        if (!n)
                            return;
                        const opts = Object.keys(rec).filter((k) => /^Attribute /.test(k)).map((k) => String(rec[k]).trim()).filter(Boolean);
                        /* A known field still has something to say: its option list. The
                           file is the source of truth, so a list edited in one copy of the
                           app arrives intact in another. Differences are reported rather
                           than applied silently, since adopting a shorter list is what
                           turns existing values amber. */
                        if (known.has(n)) {
                            const cur = fieldByName[n];
                            if (!cur || !opts.length)
                                return;
                            const before = cur.o || [];
                            if (!before.length)
                                return;
                            const same = before.length === opts.length && before.every((x, i) => x === opts[i]);
                            if (same)
                                return;
                            const gone = before.filter((x) => !opts.includes(x));
                            const gained = opts.filter((x) => !before.includes(x));
                            if (!gone.length && !gained.length)
                                return; // reordering only
                            nextLists[n] = opts;
                            listChanges.push({ field: cur.a, name: n, gone, gained });
                            return;
                        }
                        const f = {
                            i: ++nextId,
                            n,
                            a: String(rec["Alias"] || n).trim(),
                            t: String(rec["View Tabs"] || "Parent Tract").split(",").map((x) => x.trim()).filter(Boolean),
                            y: String(rec["Field Type"] || "Short Text").trim(),
                            custom: true,

                        if (opts.length)
                            f.o = opts;
                        known.add(n);
                        added.push(f);

                const nameSet = new Set(all.map((f) => f.n));
                const typeByName = Object.fromEntries(all.map((f) => [f.n, f.y]));

                const aliasMap = { ...ALIAS_TO_NAME };
                all.forEach((f) => { aliasMap[String(f.a).trim().toLowerCase()] = f.n; });
                if (fsheet) {
                    XLSX.utils.sheet_to_json(fsheet, { defval: "" }).forEach((rec) => {
                        const fn = String(rec["Field Name"] || "").trim();

                    const k = String(h).trim();

                if (!sheet)
                    throw new Error("no sheet");
                const raw = XLSX.utils.sheet_to_json(sheet, { defval: "" });
                if (!raw.length)
                    throw new Error("empty");

                const proj = {};
                const problems = [];
                let seq = 0;
                const fldByName = Object.fromEntries(all.map((f) => [f.n, f]));
                const imported = raw.map((rec, idx) => {
                    const r = { _id: uid() };
                    all.forEach((f) => (r[f.n] = ""));
                    const rowNo = idx + 2; // sheet row, header is 1
                    const rowId = () => String(rec["Tract ID"] ?? rec.TractID ?? "").trim();
                    Object.entries(rec).forEach(([k, v]) => {
                        const key = resolve(k);
                        if (!key) {
                            rejected.add(String(k).trim());
                            return;
                        }
                        const f = fldByName[key];
                        const raw0 = v;
                        const txt = String(v ?? "").trim();
                        const log = (issue, kept) => problems.push({ row: rowNo, tract: rowId(), field: f ? f.a : key,
                            name: key, value: String(raw0 ?? ""), issue, kept });
                        if (txt === "") {
                            r[key] = "";
                            return;
                        }
                        /* A type mismatch cannot be stored, so the cell is left blank and
                           reported. A value outside a pick list is kept as typed. */
                        if (f && f.y === "Date") {
                            const iso = toISODate(raw0);
                            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) {
                                r[key] = "";
                                log("Not a date", "cleared");
                                return;
                            }
                            r[key] = iso;
                            return;
                        }
                        if (f && isNumericType(f.y)) {
                            if (num(raw0) === null) {
                                r[key] = "";
                                log("Not a number", "cleared");
                                return;
                            }
                            r[key] = raw0;
                            return;
                        }
                        if (f && f.o && f.o.length) {
                            const allowed = new Set(f.o.map((o) => String(o)));
                            const retired = RETIRED_VALUES[f.n] || {};
                            if (f.y === "Multiple Selection") {
                                const bad = txt.split(",").map((x) => x.trim()).filter((x) => x && !allowed.has(x));
                                if (bad.length) {
                                    const note = bad.map((b) => retired[b]).find(Boolean);
                                    log(note ? `Not in list: ${bad.join(", ")}. ${note}`
                                        : `Not in list: ${bad.join(", ")}`, "kept");
                                }
                            }
                            else if (!allowed.has(txt)) {
                                log(retired[txt] ? `Not in list. ${retired[txt]}` : "Not in list", "kept");
                            }
                        }
                        r[key] = raw0;
                    });
                    PROJECT_FIELDS.forEach((p) => { if (r[p] && !proj[p])

                    if (!isNaN(s))
                        seq = Math.max(seq, s);
                    if (!r.TractType)
                        r.TractType = r.ParentID ? "Owner" : "Parent";
                    if (!String(r.Online || "").trim())
                        r.Online = "Y"; // no column means nothing is retired
                    return r;
                });
                imported.forEach((r) => { if (!r.SysID)
                    r.SysID = pad10(++seq); });
                // Duplicate Tract IDs in the file break parent/owner matching, so they
                // are reported alongside the value problems.
                const idCount = {};
                imported.forEach((r) => { const k = String(r.TractID || "").trim(); if (k)
                    idCount[k] = (idCount[k] || 0) + 1; });
                Object.entries(idCount).forEach(([k, nDup]) => {
                    if (Number(nDup) > 1)
                        problems.push({ row: "—", tract: k, field: "Tract ID", name: "TractID",
                            value: k, issue: `Appears ${Number(nDup)} times in the file`, kept: "kept" });
                });
                /* Contact notes ride along in their own sheet. A file without one loads
                   clean: an older line list simply has no log yet. Off-list methods and
                   outcomes are kept as typed and reported, matching how the line list
                   treats a value outside a pick list. */
                const nsheet = wb.Sheets[CONTACT_SHEET];
                const readNotes = [];
                /* An empty log has several causes that look identical on screen: no
                   sheet, a sheet with only a header, or headers this build cannot match.
                   Naming the case in the toast turns a silent nothing into something a
                   user can act on. */
                let noteReport = nsheet ? "" : `No ${CONTACT_SHEET} sheet in this file.`;
                if (nsheet) {
                    const nraw = XLSX.utils.sheet_to_json(nsheet, { header: 1, defval: "" });
                    const nhdr = (nraw[0] || []).map((h) => String(h || "").trim().toLowerCase());
                    const at = Object.fromEntries(NOTE_COLS.map((c) => {
                        let i = nhdr.indexOf(c.a.toLowerCase());
                        if (i === -1)
                            i = nhdr.findIndex((h) => NOTE_ALIAS_TO_KEY[h] === c.k);

                       If neither header resolves, the sheet is not in a shape this build
                       understands and every row would be dropped without explanation. */
                    const unmatched = NOTE_COLS.filter((c) => at[c.k] === -1).map((c) => c.a);
                    if (at.TractID === -1 && at.NoteText === -1) {
                        problems.push({ row: 1, tract: "—", field: CONTACT_SHEET, name: "ContactNotes",
                            value: (nraw[0] || []).join(", ").slice(0, 120),
                            issue: `${CONTACT_SHEET}: header row not recognised, no notes read`, kept: "cleared" });

                    }
                    else if (unmatched.length) {
                        problems.push({ row: 1, tract: "—", field: CONTACT_SHEET, name: "ContactNotes",
                            value: unmatched.join(", "),
                            issue: `${CONTACT_SHEET}: column(s) missing, read as blank`, kept: "kept" });

                        const row = nraw[i] || [];

                            NoteID: String(get(row, "NoteID") || "").trim(),
                            TractID: String(get(row, "TractID") || "").trim(),
                            PartyName: String(get(row, "PartyName") || "").trim(),
                            ContactDate: toISODate(get(row, "ContactDate")),
                            ContactTime: toHHMM(get(row, "ContactTime")),
                            ContactMethod: String(get(row, "ContactMethod") || "").trim(),
                            Outcome: String(get(row, "Outcome") || "").trim(),
                            Author: String(get(row, "Author") || "").trim(),
                            NoteText: String(get(row, "NoteText") || "").trim(),

                        if (!NOTE_COLS.some((c) => c.k !== "NoteID" && rec[c.k]))
                            continue;
                        const nrow = i + 1;
                        if (!rec.TractID)
                            problems.push({ row: nrow, tract: "—", field: "Tract ID", name: "TractID",
                                value: "", issue: `${CONTACT_SHEET}: note has no tract`, kept: "kept" });
                        if (rec.ContactMethod && !CONTACT_METHODS.includes(rec.ContactMethod))
                            problems.push({ row: nrow, tract: rec.TractID, field: "Contact Method", name: "ContactMethod",
                                value: rec.ContactMethod, issue: `${CONTACT_SHEET}: not in list`, kept: "kept" });
                        if (rec.Outcome && !CONTACT_OUTCOMES.includes(rec.Outcome))
                            problems.push({ row: nrow, tract: rec.TractID, field: "Outcome", name: "Outcome",
                                value: rec.Outcome, issue: `${CONTACT_SHEET}: not in list`, kept: "kept" });
                        readNotes.push(rec);
                    }
                    const usedIds = new Set(readNotes.map((n) => n.NoteID).filter(Boolean));
                    readNotes.forEach((n) => {
                        if (n.NoteID)
                            return;
                        let cand = nextNoteId([...readNotes].filter((x) => x.NoteID));
                        while (usedIds.has(cand))
                            cand = `CN-${String(parseInt(cand.slice(3), 10) + 1).padStart(4, "0")}`;
                        n.NoteID = cand;
                        usedIds.add(cand);
                    });
                }
                if (nsheet && !noteReport) {
                    noteReport = readNotes.length
                        ? `${readNotes.length} contact note(s) loaded.`
                        : `${CONTACT_SHEET} sheet found but it holds no notes yet.`;
                }

                   an exclusive easement. The rows are kept, but the count blanks, so it
                   is reported rather than quietly changing the numbers. */
                const ownerParents = {};
                imported.forEach((r) => {
                    if (!isOwnerRow(r))
                        return;
                    const k = String(r.ParentID || "").trim();
                    if (k)
                        ownerParents[k] = (ownerParents[k] || 0) + 1;
                });
                imported.forEach((r) => {
                    if (isOwnerRow(r) || takesOwners(r))
                        return;
                    const n = ownerParents[String(r.TractID || "").trim()];
                    if (n)
                        problems.push({ row: "—", tract: String(r.TractID), field: "Tract Type",
                            name: "TractType", value: String(r.TractType),
                            issue: `${n} owner row(s) under a ${r.TractType} tract, which holds none. `
                                + `Owner Count reads blank.`, kept: "kept" });
                });
                /* Adopting a list is a schema change, so it belongs in the same review
                   report as an off-list value rather than only in a toast that scrolls
                   away. Values the file drops are named, because those are the ones
                   that will show amber on rows already using them. */
                if (Object.keys(nextLists).length) {
                    setListOverrides((prev) => ({ ...prev, ...nextLists }));
                    listChanges.forEach((c) => {
                        if (c.gained.length)
                            problems.push({ row: "—", tract: "—", field: c.field,
                                name: c.name, value: c.gained.join(", "),
                                issue: "Fields sheet: choice(s) added to this list", kept: "kept" });
                        if (c.gone.length)
                            problems.push({ row: "—", tract: "—", field: c.field,
                                name: c.name, value: c.gone.join(", "),
                                issue: "Fields sheet: choice(s) no longer offered. Rows still holding them read off-list.",
                                kept: "kept" });

                    setCustomFields((p) => [...p, ...added]);

                const freshOv = new Set();
                setOv(freshOv);
                setRows(derive(imported, freshOv));
                setFilters({});
                setSearch("");
                setSort({ col: null, dir: 1 });
                const first = imported.find((r) => !isOwnerRow(r));
                setSelected(first ? String(first.TractID) : null);
                setDirty(false);
                const msg = [`Imported ${imported.length} rows.`];
                if (added.length)
                    msg.push(`${added.length} field(s) added from the Fields sheet.`);
                if (listChanges.length)
                    msg.push(`${listChanges.length} option list(s) updated from the Fields sheet.`);
                if (noteReport)
                    msg.push(noteReport);
                if (rejected.size)
                    msg.push(`Skipped unmatched columns: ${[...rejected].slice(0, 5).join(", ")}${rejected.size > 5 ? "…" : ""}`);
                if (problems.length)
                    msg.push(`${problems.length} value(s) need review.`);
                notify(msg.join(" "));
                if (problems.length)
                    setModal({ type: "importErrors", problems, columns: [...rejected] });
            }
            catch {
                notify("That file could not be read as a line list. It needs a Line List sheet with a header row of field names.");
            }
        };

    };
    const onPickFile = (e) => {
        const el = e.target;
        const f = el && el.files ? el.files[0] : null;
        if (el)
            el.value = "";

            return;
        if (rows.length)
            setModal({ type: "confirmImport", file: f });
        else
            doImport(f);
    };

    const formTabs = useMemo(() => {
        const t = TAB_ORDER.filter((x) => x !== "Project");

            if (x === "Crossings")
                return selectedParent && hasCrossing(selectedParent);
            if (x === "Owner")
                return selectedParent && takesOwners(selectedParent);
            return true;
        });
    }, [selectedParent]);
    useEffect(() => { if (!formTabs.includes(formTab))
        setFormTab(formTabs[0] || "Parent Tract"); }, [formTabs, formTab]);
    /* Moving to another tract lands on its parent record. The form tab is left
       alone, so stepping through tracts stays on Legal, Cost, or wherever the
       user is working. */
    useEffect(() => { setFormSide("parent"); }, [selected]);
    /* Opening the form from a grid lands on that grid's tab, so the context the
       user was working in carries over instead of resetting to Parent Tract. */
    /* Alt with the arrow keys walks tracts without leaving the keyboard, and the
       modifier keeps it clear of plain arrow use inside a cell. */
    useEffect(() => {
        const h = (e) => {
            if (!e.altKey || e.metaKey || e.ctrlKey)
                return;
            if (e.key === "ArrowDown" || e.key === "ArrowRight") {
                e.preventDefault();
                step(1);
            }
            if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
                e.preventDefault();
                step(-1);
            }
        };
        window.addEventListener("keydown", h);
        return () => window.removeEventListener("keydown", h);
    }, [step]);
    const openForm = useCallback((r) => {
        const pid = String(isOwnerRow(r) ? r.ParentID : r.TractID);
        setSelected(pid);

/* ========================= STYLES ========================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600;700&display=swap');

/* Montserrat is the display face: wordmark, view and dialog headings only.
   It is a wide geometric sans, so keeping it out of the grid preserves the
   measured column widths. Open Sans carries all UI and data text.
   Consolas is a Windows system font with no web source, hence the fallbacks. */

.rlp{
  /* brand, exactly as specified */
  --ink:#12161C; --primary:#142442; --support:#4A6B8A; --accent:#B84A1A; --gray:#E6E2E2; --ground:#FAF9F9; --paper:#FFFFFF;
  /* dark chrome, and what stays legible on it */
  --primary-2:#233856; --primary-3:#2F4866; --primary-line:#2A405F; --on-dark:#EDEAEA; --on-dark-dim:#AFB8C3;
  /* interactive blue */
  --support-2:#3A536B; --support-pale:#DADFE5; --support-wash:#E8EBEE; --support-line:#B0BDCA;
  /* warm neutral ramp */
  --mid:#494B4F; --dim:#696A6D; --faint:#919093; --rule:var(--gray); --rule-2:#F0EEEE; --rule-3:#C4C1C2; --wash:#F3F1F1; --wash-2:#F7F5F5;
  /* danger, held clear of accent by hue */
  --danger:#A31E2A; --danger-2:#831C27; --danger-pale:#F1E3E4; --danger-line:#DBAAAE;
  /* caution / off-list */
  --warn:#C08A12; --warn-ink:#705517; --warn-pale:#F3ECDD; --warn-line:#E2CA98; --warn-on-dark:#DEC48A;
  position:fixed; inset:0; display:flex; flex-direction:column;
  background:var(--ground); color:var(--ink);
  --display:Montserrat,'Segoe UI',system-ui,sans-serif;
  --body:'Open Sans','Segoe UI',system-ui,sans-serif;
  --mono:Consolas,ui-monospace,'SF Mono',Menlo,monospace;
  font-family:var(--body); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.rlp *{box-sizing:border-box}
.rlp button{font:inherit; color:inherit; cursor:pointer}
.rlp input,.rlp select,.rlp textarea{font:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono); font-size:11.5px}
.dim{color:var(--dim)}
.spacer{flex:1}
.rlp :focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- topbar ---------- */
.topbar{display:flex; align-items:center; gap:20px; padding:0 16px; height:56px;
  background:var(--primary); color:var(--on-dark); flex:0 0 auto}
.brand{display:flex; align-items:baseline; gap:8px; flex:0 0 auto}
.mark{font-family:var(--display); font-weight:700; letter-spacing:.14em; font-size:11.5px; color:var(--on-dark-dim);
  border:1px solid var(--primary-line); padding:3px 6px; border-radius:2px}
.wordmark{font-family:var(--display); font-weight:700; font-size:14.5px; letter-spacing:.005em}
.wordmark em{font-style:normal; color:var(--on-dark-dim); font-weight:500}

.projstrip{display:flex; gap:10px; flex:1; min-width:0; overflow-x:auto}
.projfield{display:flex; flex-direction:column; gap:2px; min-width:118px}
.projfield span{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--on-dark-dim)}
.projfield input,.projfield select{background:var(--paper); border:1px solid var(--support-line); border-radius:3px;
  color:var(--ink); padding:3px 6px; height:24px; width:100%}
.projfield input:focus,.projfield select:focus{border-color:#fff}

.topactions{display:flex; gap:8px; flex:0 0 auto}

/* ---------- buttons ---------- */
.btn{border:1px solid transparent; border-radius:3px; padding:5px 12px; height:28px;
  font-size:12.5px; font-weight:500; white-space:nowrap}
.btn.pale{background:var(--wash); color:var(--primary); border-color:var(--rule-3)}
.btn.pale:hover:not(:disabled){background:var(--paper)}
/* Without this a disabled pale button is indistinguishable from a live one,
   so Clear looked clickable with nothing loaded. */
.btn.pale:disabled{background:var(--primary-2); color:var(--on-dark-dim);
  border-color:var(--primary-line); cursor:not-allowed}
.btn.solid{background:var(--support); color:#fff}
.btn.solid:hover{background:var(--support-2)}
.btn.solid:disabled{background:var(--faint); cursor:not-allowed}
.btn.ghost{background:var(--paper); border-color:var(--rule); color:var(--mid)}
.btn.ghost:hover{border-color:var(--rule-3); color:var(--ink)}
.btn.ghost.on{background:var(--support-pale); border-color:var(--support); color:var(--support-2)}
.btn.ghost:disabled{color:var(--faint); cursor:not-allowed; background:var(--wash)}
.btn.link{background:none; color:var(--mid); padding:5px 8px}
.btn.link:hover{color:var(--ink); text-decoration:underline}
.btn.danger{background:var(--danger); color:#fff}

/* ---------- tract header strip (single horizontal row, never wraps) ---------- */
.titleblock{
  background:var(--paper); border-bottom:1px solid var(--rule);
  border-top:2px solid var(--primary); flex:0 0 auto; height:44px; overflow:hidden;
}
.tbcell{
  gap:7px; padding:0 12px; height:44px; line-height:44px;
  border-right:1px solid var(--rule-2); white-space:nowrap; overflow:hidden;
}
.tbcell:last-child{border-right:none}
.tbcount{background:var(--wash)}
.tblabel{flex:0 0 auto; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.tbvalue{flex:1 1 auto; min-width:0; font-size:13px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis}
.titleblock.empty .tbvalue{color:var(--faint); font-weight:500}

/* ---------- nav ---------- */
.nav{display:flex; align-items:center; gap:2px; padding:0 12px; height:40px;
  background:var(--primary-2); overflow-x:auto; flex:0 0 auto}
.navcap{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--on-dark-dim);
  margin-right:8px; flex:0 0 auto; font-weight:600}
.navdiv{width:1px; height:18px; background:var(--primary-line); margin:0 10px; flex:0 0 auto}
.navbtn{background:none; border:none; color:var(--paper); padding:6px 11px; border-radius:3px;
  font-size:13px; font-weight:500; white-space:nowrap; flex:0 0 auto}
.navbtn:hover{background:var(--primary-3); color:var(--paper)}
/* Nav buttons are styled inline by navBtnStyle; see that function. */
.navbtn:disabled{color:var(--support-line); cursor:not-allowed; background:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid var(--rule); flex:0 0 auto}
.rowcount{font-size:11.5px; color:var(--dim)}
.searchbox{background:var(--paper); border:1px solid var(--rule); border-radius:3px;
  padding:4px 9px; height:28px; width:220px}
.searchbox:focus{border-color:var(--support)}

/* ---------- stage ---------- */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}

/* ---------- grid ---------- */
.gridwrap{flex:1 1 auto; min-height:0; overflow:auto; position:relative; background:var(--paper)}
/* the header must be the only thing pinned while the body scrolls under it */
.grid thead{position:sticky; top:0; z-index:6}
.grid{border-collapse:separate; border-spacing:0; table-layout:fixed}
.grid th{position:sticky; top:0; z-index:3; background:var(--wash); text-align:left;
  box-sizing:border-box; padding:0 8px; height:30px; font-size:10.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:var(--primary);
  border-right:1px solid var(--rule-2); border-bottom:1px solid var(--rule);
  cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; vertical-align:middle}
/* numeric columns are right-aligned in the body, so their headers are too */
.grid th.numhead{text-align:right}
.grid th.numhead .thlabel{float:none}
.grid th:hover{background:var(--support-wash)}
.thlabel{display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom}
.sortmark{margin-left:4px; color:var(--support)}
.grid th.stick,.grid td.stick{position:sticky; left:0; z-index:2}
.grid th.stick{z-index:4}
.grid td.stick{background:var(--paper); border-right:1px solid var(--rule)}
.grid tr.sel td.stick{background:var(--support-pale)}
.grid tr.ownerrow td.stick{background:var(--support-wash)}
.grid tr.permitrow td.stick{background:var(--wash)}
.grid tr.sel.ownerrow td.stick,.grid tr.sel.permitrow td.stick{background:var(--support-pale)}
.filterrow th{top:30px; z-index:3; background:var(--wash-2); padding:2px 3px; height:28px; cursor:default}
.filterrow input{width:100%; height:22px; border:1px solid var(--rule-2); border-radius:2px;
  padding:0 5px; font-size:11.5px; background:#fff}
.thend{width:72px; cursor:default}

.grid td{box-sizing:border-box; height:${ROW_H}px; padding:0; border-right:1px solid var(--rule-2);
  border-bottom:1px solid var(--rule-2); overflow:hidden; vertical-align:middle}
/* Row shading carries the row's role: owner rows a step of grey-blue,
   crossing tracts (Permit, Encroachment) a faded maroon. Exclusive Easement
   is an ordinary parent tract, so it stays white. Hover keeps each hue. */
.grid tr.ownerrow{background:var(--support-wash)}
.grid tr.permitrow{background:var(--wash)}
.grid tr.sel{background:var(--support-pale)}
.grid tr:hover td{background:var(--wash-2)}
.grid tr.ownerrow:hover td{background:var(--support-wash)}
.grid tr.permitrow:hover td{background:var(--wash)}
.grid tr.sel:hover td{background:var(--support-pale)}
.grid tr.sel.ownerrow:hover td,.grid tr.sel.permitrow:hover td{background:var(--support-pale)}

.cell{display:block; box-sizing:border-box; width:100%; height:${ROW_H - 2}px;
  border:none; background:transparent; padding:0 8px; font-size:12.5px; margin:0}
.cell:focus{background:var(--paper); box-shadow:inset 0 0 0 2px var(--accent); border-radius:2px}
.cell.num{text-align:right}
.cell.calc{background:var(--support-wash); box-shadow:inset 0 -2px 0 var(--support-line)}
.cell.ro{display:flex; align-items:center; color:var(--dim); font-size:12px}
select.cell{appearance:none; cursor:pointer}
.rowend{text-align:center; background:var(--paper); white-space:nowrap; padding:0 2px}
.openform{background:none; border:1px solid var(--rule); border-radius:3px; color:var(--support-2);
  font-size:11px; font-weight:600; padding:2px 6px; margin-right:2px}
.openform:hover{background:var(--support-pale); border-color:var(--support)}
.del{background:none; border:none; color:var(--faint); font-size:16px; line-height:1; padding:2px 6px; border-radius:3px}
.del:hover{color:var(--danger); background:var(--danger-pale)}

/* ---------- empty ---------- */
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:40px}
.emptyrule{width:56px; height:2px; background:var(--support)}
.empty h2{margin:0; font-size:18px; font-weight:600}
.empty p{margin:0; max-width:420px; color:var(--mid)}
.emptyactions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; justify-content:center}
.emptynote{margin:14px 0 0; max-width:46ch; font-size:12px; color:var(--dim); line-height:1.5}

/* ---------- form ---------- */
.form{flex:1; min-height:0; display:flex; overflow:hidden}
.formside{flex:0 0 210px; border-right:1px solid var(--rule); background:var(--wash); overflow:auto; padding:8px}
.sidebtn{display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  background:none; border:1px solid transparent; border-radius:4px; padding:7px 9px; margin-bottom:3px}
.sidebtn:hover{background:var(--support-wash)}
.sidebtn.on{background:var(--paper); border-color:var(--support); box-shadow:0 1px 2px rgba(18,50,92,.10)}
.sidecap{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.sideval{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.formmain{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.formtabs{display:flex; gap:2px; padding:8px 14px 0; overflow-x:auto;
  border-bottom:1px solid var(--rule); background:var(--wash); flex:0 0 auto}
.ftab{background:none; border:none; border-bottom:3px solid transparent; padding:7px 12px;
  font-size:12.5px; font-weight:500; color:var(--mid); white-space:nowrap; flex:0 0 auto}
.ftab:hover{color:var(--primary); background:var(--support-wash)}
.ftab.on{color:var(--primary); font-weight:700; border-bottom-color:var(--accent); background:var(--paper)}

.fieldgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px 16px;
  padding:16px; overflow:auto}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field.wide{grid-column:1/-1}
.flabel{display:flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mid); font-weight:600}
.autotag{font-style:normal; font-size:9px; letter-spacing:.08em; color:var(--support-2);
  background:var(--support-wash); border:1px solid var(--support-line); border-radius:2px; padding:0 4px}
.req{font-style:normal; font-size:9px; letter-spacing:.06em; color:var(--danger)}
.field .cell{height:30px; border:1px solid var(--rule); border-radius:3px; background:var(--paper)}
.field textarea.cell{height:auto; padding:6px 8px; resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:3px 10px;
  font-size:12px; color:var(--mid)}
.chip.on{background:var(--support-pale); border-color:var(--support); color:var(--support-2); font-weight:600}

.notice{padding:14px 16px; color:var(--mid); background:var(--wash);
  border:1px dashed var(--rule); border-radius:4px; margin:16px}
.notice.pad{margin:24px}

/* ---------- owner list ---------- */
.ownerlist{flex:1; overflow:auto; padding:16px 18px}
.lede{margin:0 0 14px; color:var(--mid); max-width:620px}
.ownercard{background:var(--paper); border:1px solid var(--rule-2); border-radius:4px; margin-bottom:6px}
.ownercard.open{border-color:var(--support)}
.ownerhead{display:flex; align-items:baseline; gap:14px; width:100%; text-align:left;
  background:none; border:none; padding:10px 14px}
.ownername{font-weight:600; font-size:13.5px}
.ownermeta{font-size:11.5px; color:var(--dim); flex:0 0 auto}
.ownertracts{font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ownerbody{border-top:1px solid var(--rule-2)}
.ownerfoot{display:flex; gap:8px; align-items:center; padding:0 16px 14px}

/* ---------- fields view ---------- */
.fieldsview{flex:1; min-height:0; display:flex; flex-direction:column}
.fieldsbar{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule)}
.fieldstable{width:100%; table-layout:auto}
.fieldstable td{height:28px}
.pad6{padding:0 10px; font-size:12.5px}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(18,50,92,.42); display:flex;
  align-items:center; justify-content:center; padding:24px; z-index:50}
.sheet{background:var(--paper); border-radius:5px; width:min(640px,100%); max-height:88vh;
  overflow:auto; box-shadow:0 18px 48px rgba(18,50,92,.30); border-top:3px solid var(--support)}
.sheet h3{font-family:var(--display); margin:0; padding:16px 18px 4px; font-size:16px;
  font-weight:700; letter-spacing:-.005em; color:var(--primary)}
.sheetlede{margin:0; padding:0 18px; color:var(--mid)}
.sheet .fieldgrid{padding:14px 18px}
.sheetfoot{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px 16px;
  border-top:1px solid var(--rule-2)}
.warn{margin:0 18px; padding:8px 10px; background:var(--danger-pale); border-left:3px solid var(--danger);
  color:var(--danger-2); font-size:12.5px; border-radius:2px}
.collist{padding:12px 18px; max-height:46vh; overflow:auto}
.colrow{display:flex; align-items:center; gap:9px; padding:4px 0}
.colrow em{margin-left:auto; font-style:normal}

/* ---------- admin ---------- */
.adview{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.adbar{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; padding:12px 16px;
  background:var(--paper); border-bottom:1px solid var(--rule); flex:0 0 auto}
.admeta{font-size:11.5px; color:var(--dim)}
.adscroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 28px; max-width:820px}
.adhead{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.adhead h4{font-family:var(--display); margin:0; font-size:14px; font-weight:700; color:var(--primary)}
.adlede{margin:0 0 14px; font-size:12px; color:var(--dim); line-height:1.5; max-width:74ch}

.adlist{list-style:none; margin:0 0 14px; padding:0; border:1px solid var(--rule);
  border-radius:4px; background:var(--paper); overflow:hidden}
.aditem{display:flex; align-items:center; gap:9px; padding:6px 11px;
  border-bottom:1px solid var(--rule)}
.aditem:last-child{border-bottom:none}
.aditem:nth-child(even){background:var(--wash-2)}
.aditem .btn.link{padding:2px 6px; height:auto; font-size:11.5px}
.aditem .cell{flex:1 1 auto; height:26px; border:1px solid var(--support);
  border-radius:3px; padding:3px 7px; min-width:0}
.adord{width:20px; flex:0 0 20px; font-size:10.5px; color:var(--faint); text-align:right}
.adval{font-size:13px; color:var(--ink)}

.adadd{display:flex; gap:8px; align-items:center; max-width:460px}
.adadd .cell{flex:1 1 auto; height:30px; border:1px solid var(--rule-3); border-radius:3px;
  padding:5px 8px; background:var(--paper); min-width:0}
.adadd .cell:focus{border-color:var(--support)}

@media (max-width:900px){
  .aditem{flex-wrap:wrap}
  .adscroll{max-width:none}
}

/* ---------- contact notes ---------- */
.cnview{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
.cnbar{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; padding:12px 16px;
  background:var(--paper); border-bottom:1px solid var(--rule); flex:0 0 auto}
.cnf{display:flex; flex-direction:column; gap:3px; min-width:0}
.cnf > span{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.cnf .cell{border:1px solid var(--rule-3); border-radius:3px; background:var(--paper);
  padding:4px 7px; height:28px; width:100%}
.cnf .cell:focus{border-color:var(--support)}
.cnactions{flex-direction:row; align-items:center; gap:6px; margin-left:auto}

.cnscroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 16px 28px}
.cncount{font-size:11.5px; color:var(--dim); margin:0 0 10px 2px}
.cnscroll .notice{border:1px dashed var(--rule); border-radius:4px; text-align:center}

/* Day rule. Sticky so the date stays readable while scrolling a long feed. */
.cnday{margin-bottom:16px}
.cndate{font-family:var(--display); position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:9px;
  margin:0 0 8px; padding:5px 2px; background:var(--ground);
  font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--primary); border-bottom:1px solid var(--support-line)}
.cndaycount{margin-left:auto; font-weight:500; letter-spacing:0; color:var(--dim);
  font-size:10.5px}

.cnentry{background:var(--paper); border:1px solid var(--rule);
  border-left:3px solid var(--primary-2); border-radius:4px; padding:10px 13px; margin-bottom:8px}
.cnhead{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:5px}
.cnhead .btn.link{padding:2px 6px; height:auto; font-size:11.5px}
.cntract{font-weight:700; font-size:13.5px; color:var(--primary); letter-spacing:-.01em}
.cnname{font-size:12.5px; color:var(--mid)}
.cnsub{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:7px}
.cnparty{font-size:12.5px; color:var(--ink)}
.cnmeta{font-size:11.5px; color:var(--dim)}
.cnid{font-size:10.5px; color:var(--faint)}
.cntag{background:var(--support-pale); border:1px solid var(--support-line); color:var(--support-2);
  border-radius:2px; padding:1px 6px; font-size:9.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
.cntag.warn{background:var(--warn-pale); border-color:var(--warn-line); color:var(--warn-ink)}
.cnbody{margin:0; white-space:pre-wrap; line-height:1.5; color:var(--ink); max-width:104ch}

.cnediting{border-left-color:var(--warn); background:var(--wash-2)}
.cnform{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px}
.cnnote{margin-bottom:10px}
.cnnote textarea{min-height:82px; resize:vertical; line-height:1.5; padding:7px}
.cnfoot{display:flex; align-items:center; gap:8px}

@media (max-width:900px){
  .cnactions{margin-left:0}
  .cnbody{max-width:none}
}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  background:var(--primary); color:var(--on-dark); padding:10px 16px; border-radius:4px;
  box-shadow:0 8px 22px rgba(18,50,92,.30); max-width:640px; z-index:60; font-size:12.5px}

@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}
}
@media (max-width:1100px){
  .titleblock{overflow-x:auto}
}
@media (max-width:900px){
  .projstrip{display:none}
  .formside{flex-basis:150px}
}
`;
ReactDOM.createRoot(document.getElementById("root"))
    .render(React.createElement(ROWLineListPro));
