/* ========================= CELL EDITOR ========================= */
const READ_ONLY = new Set(["SysID", "CreateBy", "CreateDate", "EditBy", "EditDate", "OwnerCount"]);

/* Box model is inline so a header cell and the input beneath it always share
   the same padding and border, whatever else is on the page. */
const CELL_BASE = {
  display: "block", boxSizing: "border-box", width: "100%", height: ROW_H - 2,
  border: "none", margin: 0, padding: "0 8px", background: "transparent",
  font: "inherit", fontSize: 12.5, color: "inherit",
};

function Cell({ f, row, setCell, ov, parentIds, inForm }) {
  const v = row[f.n] ?? "";
  const owner = isOwnerRow(row);
  /* Currency and percent read formatted at rest and raw while being typed into,
     so the caret never has to fight a thousands separator. */
  const [editing, setEditing] = useState(false);
  const formatted = MONEY.has(f.n) || PERCENT.has(f.n);

  /* An imported value outside the pick list stays visible and flagged rather
     than rendering as an empty select that hides what is actually stored. */
  const offList = !!f.o && f.o.length > 0 && String(v).trim() !== "" &&
    (f.y === "Multiple Selection"
      ? String(v).split(",").map((x) => x.trim()).filter(Boolean).some((x) => !f.o.includes(x))
      : !f.o.includes(String(v)));
  const flag = offList ? { background: "#FBF1E7", boxShadow: "inset 0 -2px 0 #D8A657" } : null;
  const offTitle = offList ? `Not one of the choices for ${f.a}. Imported as typed.` : undefined;
  const isCalc = CALC.has(f.n) && !ov.has(ovKey(row._id, f.n));
  const numeric = isNumericType(f.y);

  /* Money reads as money — no derived-value tint. On a grid where nearly every
     cell is calculated the marker was noise, and its underline cut across the
     columns it was meant to sit inside. */
  const markCalc = isCalc && !MONEY.has(f.n) && !PERCENT.has(f.n);
  const st = inForm ? undefined : {
    ...CELL_BASE,
    textAlign: numeric ? "right" : "left",
    fontVariantNumeric: numeric ? "tabular-nums" : "normal",
    ...(markCalc ? { background: "#F2F6FB", boxShadow: "inset 0 -2px 0 #9EBFDF" } : {}),
  };
  const cls = `cell ${markCalc ? "calc" : ""} ${numeric ? "tnum num" : ""}`;

  if (READ_ONLY.has(f.n)) {
    return <span className="cell ro tnum" style={inForm ? undefined : { ...CELL_BASE, lineHeight: `${ROW_H - 2}px`, opacity: .68 }}>{String(v || "")}</span>;
  }

  if (f.n === "TractType") {
    if (owner) return <span className="cell ro" style={inForm ? undefined : { ...CELL_BASE, lineHeight: `${ROW_H - 2}px`, opacity: .68 }}>Owner</span>;
    return (
      <select className={cls} style={st} value={v} onChange={(e) => setCell(row._id, f.n, e.target.value)}>
        <option value="" />
        {PARENT_TYPES.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }

  if (f.n === "ParentID") {
    if (!owner) return <span className="cell ro" style={inForm ? undefined : CELL_BASE} />;
    return (
      <select className={cls} style={st} value={v} onChange={(e) => setCell(row._id, f.n, e.target.value)}>
        <option value="" />
        {parentIds.map((p) => <option key={p} value={p}>{p}</option>)}
      </select>
    );
  }

  if (f.y === "List") {
    return (
      <select className={cls} style={{ ...st, ...flag }} title={offTitle}
        value={v} onChange={(e) => setCell(row._id, f.n, e.target.value)}>
        <option value="" />
        {offList && <option value={v}>{`${v}  (not a choice)`}</option>}
        {(f.o || []).map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  }

  if (f.y === "Multiple Selection") {
    const picked = String(v || "").split(",").map((s) => s.trim()).filter(Boolean);
    if (!inForm) return <input className={cls} style={{ ...st, ...flag }} title={offTitle} value={v} onChange={(e) => setCell(row._id, f.n, e.target.value)} />;
    const toggle = (o) => {
      const next = picked.includes(o) ? picked.filter((x) => x !== o) : [...picked, o];
      setCell(row._id, f.n, next.join(", "));
    };
    return (
      <div className="chips">
        {picked.filter((x) => !(f.o || []).includes(x)).map((x) => (
          <button key={`x-${x}`} type="button" className="chip on" title={offTitle}
            style={{ background: "#FBF1E7", borderColor: "#D8A657", color: "#7A5A1E" }}
            onClick={() => toggle(x)}>{x}</button>
        ))}
        {(f.o || []).map((o) => (
          <button key={o} type="button" className={`chip ${picked.includes(o) ? "on" : ""}`} onClick={() => toggle(o)}>{o}</button>
        ))}
      </div>
    );
  }

  if (f.y === "Date") {
    return <input type="date" className={cls} style={st} value={String(v || "").slice(0, 10)} onChange={(e) => setCell(row._id, f.n, e.target.value)} />;
  }

  if (f.y === "Long Text" && inForm) {
    return <textarea className={cls} rows={3} value={v} onChange={(e) => setCell(row._id, f.n, e.target.value)} />;
  }

  return (
    <input className={cls} style={st} inputMode={numeric ? "decimal" : undefined}
      value={formatted && !editing ? displayValue(f, v) : v}
      onFocus={() => setEditing(true)}
      onBlur={() => setEditing(false)}
      onChange={(e) => setCell(row._id, f.n, e.target.value)} />
  );
}

/* ========================= GRID ========================= */
const defaultWidth = (f) => {
  if (f.n === "Order") return 80;
  if (f.n === "TractID") return 170;
  if (f.n === "TractName") return 200;
  if (f.n === "TractType") return 105;
  if (f.y === "Long Text") return 260;
  if (f.y === "Date") return 140;
  if (f.y === "List" || f.y === "Multiple Selection") return 175;
  if (isNumericType(f.y)) return 130;
  return 165;
};
const MIN_W = 64;
const ACTION_W = 78;

const TH_BASE = {
  boxSizing: "border-box", position: "sticky", top: 0, zIndex: 3, backgroundClip: "padding-box",
  background: "#EDF1F6", color: "#12325C",
  padding: "0 8px", height: 30, lineHeight: "30px",
  fontSize: 10.5, fontWeight: 700, letterSpacing: ".04em", textTransform: "uppercase",
  borderRight: "1px solid #DCE3EB", borderBottom: "1px solid #D4DBE4",
  whiteSpace: "nowrap", overflow: "hidden", userSelect: "none", cursor: "pointer",
};
const TD_BASE = {
  boxSizing: "border-box", padding: 0, height: ROW_H,
  borderRight: "1px solid #E4E9EF", borderBottom: "1px solid #EFF2F6",
  overflow: "hidden", verticalAlign: "middle",
};

function GridView({ cols, rows, sort, setSort, showFilters, filters, setFilters, setCell, selected, onSelect, onDelete, onOpenForm, focusTract, focusTick, ov, parentIds }) {
  const wrapRef = useRef(null);
  const [top, setTop] = useState(0);
  const [height, setHeight] = useState(600);
  const [widths, setWidths] = useState({});
  const drag = useRef(null);

  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setHeight(el.clientHeight));
    ro.observe(el);
    setHeight(el.clientHeight);
    return () => ro.disconnect();
  }, []);

  const widthOf = useCallback((f) => widths[f.n] ?? defaultWidth(f), [widths]);
  const total = cols.reduce((a, f) => a + widthOf(f), 0) + ACTION_W;

  /* column resize */
  useEffect(() => {
    const move = (e) => {
      const d = drag.current;
      if (!d) return;
      const next = Math.max(MIN_W, d.startW + (e.clientX - d.startX));
      setWidths((w) => (w[d.name] === next ? w : { ...w, [d.name]: next }));
    };
    const up = () => {
      if (!drag.current) return;
      drag.current = null;
      document.body.style.cursor = "";
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  }, []);

  const startResize = (e, f) => {
    e.preventDefault();
    e.stopPropagation();
    drag.current = { name: f.n, startX: e.clientX, startW: widthOf(f) };
    document.body.style.cursor = "col-resize";
  };

  /* Stepping to a tract scrolls it into view. Keyed on the tick rather than the
     selection, so clicking a row does not yank the grid around. */
  useEffect(() => {
    if (!focusTick) return;
    const el = wrapRef.current;
    if (!el) return;
    const i = rows.findIndex((r) => !isOwnerRow(r) && String(r.TractID) === String(focusTract));
    if (i < 0) return;
    const headH = showFilters ? 58 : 30;
    const rowTop = i * ROW_H;
    const view = el.clientHeight - headH;
    if (rowTop < el.scrollTop || rowTop + ROW_H > el.scrollTop + view) {
      el.scrollTop = Math.max(0, rowTop - Math.round(view / 3));
    }
  }, [focusTick]);

  const OVERSCAN = 8;
  const start = Math.max(0, Math.floor(top / ROW_H) - OVERSCAN);
  const end = Math.min(rows.length, Math.ceil((top + height) / ROW_H) + OVERSCAN);
  const slice = rows.slice(start, end);

  const toggleSort = (n) => setSort((s) => (s.col === n ? { col: n, dir: -s.dir } : { col: n, dir: 1 }));

  const handle = (f) => (
    <span
      onMouseDown={(e) => startResize(e, f)}
      onClick={(e) => e.stopPropagation()}
      title={`Drag to resize ${f.a}`}
      style={{ position: "absolute", top: 0, right: 0, width: 7, height: "100%",
               cursor: "col-resize", zIndex: 5, borderRight: "2px solid transparent" }}
    />
  );

  return (
    <div className="gridwrap" ref={wrapRef} onScroll={(e) => setTop(e.currentTarget.scrollTop)}
      style={{ flex: "1 1 auto", minHeight: 0, height: "100%", overflow: "auto",
               position: "relative", background: "#FFFFFF" }}>
      <table className="grid"
        style={{ tableLayout: "fixed", borderCollapse: "separate", borderSpacing: 0, width: total }}>
        <colgroup>
          {cols.map((f) => <col key={f.n} style={{ width: widthOf(f) }} />)}
          <col style={{ width: ACTION_W }} />
        </colgroup>

        <thead style={{ position: "sticky", top: 0, zIndex: 6 }}>
          <tr>
            {cols.map((f, i) => {
              const w = widthOf(f);
              const numeric = isNumericType(f.y);
              return (
                <th key={f.n}
                  onClick={() => toggleSort(f.n)}
                  title={`${f.a}  (${f.n}) — click to sort, drag the edge to resize`}
                  style={{ ...TH_BASE, position: i === 0 ? "sticky" : "sticky",
                           left: i === 0 ? 0 : undefined, zIndex: i === 0 ? 5 : 3,
                           width: w, minWidth: w, maxWidth: w,
                           textAlign: numeric ? "right" : "left" }}>
                  <span style={{ position: "relative", display: "block", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {f.a}
                    {sort.col === f.n && <span style={{ marginLeft: 4, color: "#1F6FBF" }}>{sort.dir > 0 ? "\u25B2" : "\u25BC"}</span>}
                  </span>
                  {handle(f)}
                </th>
              );
            })}
            <th style={{ ...TH_BASE, width: ACTION_W, minWidth: ACTION_W, maxWidth: ACTION_W, cursor: "default", borderRight: "none" }} />
          </tr>

          {showFilters && (
            <tr>
              {cols.map((f, i) => {
                const w = widthOf(f);
                return (
                  <th key={f.n} style={{ ...TH_BASE, top: 30, height: 28, lineHeight: "28px",
                        background: "#F6F8FB", padding: "0 3px", cursor: "default",
                        left: i === 0 ? 0 : undefined, zIndex: i === 0 ? 5 : 3,
                        width: w, minWidth: w, maxWidth: w }}>
                    <input value={filters[f.n] || ""} placeholder="…"
                      onChange={(e) => setFilters((p) => ({ ...p, [f.n]: e.target.value }))}
                      style={{ boxSizing: "border-box", width: "100%", height: 22, border: "1px solid #E7ECF2",
                               borderRadius: 2, padding: "0 5px", fontSize: 11.5, background: "#fff", font: "inherit" }} />
                  </th>
                );
              })}
              <th style={{ ...TH_BASE, top: 30, height: 28, background: "#F6F8FB", cursor: "default", borderRight: "none" }} />
            </tr>
          )}
        </thead>

        <tbody>
          {start > 0 && <tr style={{ height: start * ROW_H }}><td style={{ padding: 0, border: "none" }} colSpan={cols.length + 1} /></tr>}

          {slice.map((r) => {
            const isSel = String(isOwnerRow(r) ? r.ParentID : r.TractID) === String(selected);
            const owner = isOwnerRow(r);
            const permit = isPermitRow(r);
            const rowBg = isSel ? "#E7F0FA" : permit ? "#FAF0EF" : owner ? "#EFF3F8" : "#FFFFFF";
            const edge = permit ? "#C79C96" : owner ? "#B8D2EC" : null;
            const flagged = isFlagged(r);
            return (
              <tr key={r._id} className={`${isSel ? "sel" : ""} ${owner ? "ownerrow" : ""} ${permit ? "permitrow" : ""}`}
                onClick={() => onSelect(r)} onDoubleClick={() => onOpenForm(r)}
                title={flagged ? "Design change pending on this tract" : undefined}
                style={{ background: rowBg, color: flagged ? FLAG_RED : "#1B2735" }}>
                {cols.map((f, i) => {
                  const w = widthOf(f);
                  return (
                    <td key={f.n}
                      style={{ ...TD_BASE, width: w, minWidth: w, maxWidth: w,
                               borderRight: `1px solid ${isNumericType(f.y) ? "#D8DFE7" : "#E4E9EF"}`,
                               ...(i === 0 ? { position: "sticky", left: 0, zIndex: 2, background: rowBg,
                                               borderRight: "1px solid #D4DBE4",
                                               boxShadow: edge ? `inset 3px 0 0 ${edge}` : undefined } : {}) }}>
                      <Cell f={f} row={r} setCell={setCell} ov={ov} parentIds={parentIds} />
                    </td>
                  );
                })}
                <td style={{ ...TD_BASE, width: ACTION_W, textAlign: "center", whiteSpace: "nowrap", borderRight: "none" }}>
                  <button className="openform" title="Open tract form"
                    onClick={(e) => { e.stopPropagation(); onOpenForm(r); }}>Edit</button>
                  <button className="del" title="Delete row"
                    onClick={(e) => { e.stopPropagation(); onDelete(r); }}>{"\u00D7"}</button>
                </td>
              </tr>
            );
          })}

          {end < rows.length && <tr style={{ height: (rows.length - end) * ROW_H }}><td style={{ padding: 0, border: "none" }} colSpan={cols.length + 1} /></tr>}
        </tbody>
      </table>
    </div>
  );
}


/* ========================= FORM ========================= */
const PARENT_ONLY_TABS = new Set(["Field Survey", "Plat", "Construction", "Operations", "Crossings", "Location", "Parent Tract"]);
const OWNER_ONLY_TABS = new Set(["Owner"]);

function FormView({ tabs, tab, setTab, side, setSide, parent, owners, row, allFields, setCell, ov, parentIds }) {
  const onOwner = side !== "parent";
  const disabledTab = onOwner ? PARENT_ONLY_TABS.has(tab) && tab !== "Owner" : OWNER_ONLY_TABS.has(tab);
  const fields = allFields.filter((f) => f.t.includes(tab));

  return (
    <div className="form">
      <div className="formside">
        <button className={`sidebtn ${side === "parent" ? "on" : ""}`} onClick={() => setSide("parent")}>
          <span className="sidecap">Parent</span>
          <span className="sideval">{parent.TractID}</span>
        </button>
        {owners.map((o) => (
          <button key={o._id} className={`sidebtn ${side === o._id ? "on" : ""}`} onClick={() => setSide(o._id)}>
            <span className="sidecap">{o.TractID || "Owner"}</span>
            <span className="sideval">{o.OwnerName || "—"}</span>
          </button>
        ))}
      </div>

      <div className="formmain">
        {isFlagged(parent) && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 14px",
                        background: "#FCEFEE", borderBottom: "1px solid #E9C8C4",
                        color: FLAG_RED, fontSize: 12.5, fontWeight: 600 }}>
            Design change pending on {parent.TractID}
          </div>
        )}
        <div className="formtabs">
          {tabs.map((t) => (
            <button key={t} className={`ftab ${tab === t ? "on" : ""}`} onClick={() => setTab(t)}>{t}</button>
          ))}
        </div>

        {disabledTab ? (
          <div className="notice">
            {tab} is recorded on the parent tract only. Switch to <strong>{parent.TractID}</strong> to edit it.
          </div>
        ) : (
          <div className="fieldgrid">
            {fields.map((f) => (
              <label key={f.n} className={`field ${f.y === "Long Text" || f.y === "Multiple Selection" ? "wide" : ""}`}>
                <span className="flabel">
                  {f.a}
                  {CALC.has(f.n) && !ov.has(ovKey(row._id, f.n)) && <em className="autotag">auto</em>}
                </span>
                <Cell f={f} row={row} setCell={setCell} ov={ov} parentIds={parentIds} inForm />
              </label>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ========================= OWNER LIST (bulk edit) ========================= */
function OwnersView({ groups, fields, fieldByName, onSave }) {
  const [open, setOpen] = useState(null);
  const [draft, setDraft] = useState({});

  const start = (name, sample) => {
    setOpen(name);
    setDraft(Object.fromEntries(fields.map((n) => [n, sample[n] ?? ""])));
  };

  if (!groups.length) return <div className="notice pad">No owner rows yet. Add an owner to a tract and they'll be listed here.</div>;

  return (
    <div className="ownerlist">
      <p className="lede">Every row carrying an owner's name updates together. Edit once here instead of tract by tract.</p>
      {groups.map(([name, rs]) => (
        <div key={name} className={`ownercard ${open === name ? "open" : ""}`}>
          <button className="ownerhead" onClick={() => (open === name ? setOpen(null) : start(name, rs[0]))}>
            <span className="ownername">{name}</span>
            <span className="ownermeta tnum">{rs.length} row{rs.length > 1 ? "s" : ""}</span>
            <span className="ownertracts">{rs.map((r) => r.TractID).filter(Boolean).slice(0, 6).join("  ")}{rs.length > 6 ? " …" : ""}</span>
          </button>
          {open === name && (
            <div className="ownerbody">
              <div className="fieldgrid">
                {fields.map((n) => {
                  const f = fieldByName[n];
                  if (!f) return null;
                  return (
                    <label key={n} className="field">
                      <span className="flabel">{f.a}</span>
                      {f.y === "List" ? (
                        <select className="cell" value={draft[n] || ""} onChange={(e) => setDraft((d) => ({ ...d, [n]: e.target.value }))}>
                          <option value="" />
                          {(f.o || []).map((o) => <option key={o} value={o}>{o}</option>)}
                        </select>
                      ) : (
                        <input className="cell" value={draft[n] || ""} onChange={(e) => setDraft((d) => ({ ...d, [n]: e.target.value }))} />
                      )}
                    </label>
                  );
                })}
              </div>
              <div className="ownerfoot">
                <button className="btn solid" onClick={() => { onSave(name, draft); setOpen(null); }}>Apply to all {rs.length} rows</button>
                <button className="btn link" onClick={() => setOpen(null)}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ========================= FIELDS ========================= */
function FieldsView({ fields, onAdd, onDelete }) {
  const [q, setQ] = useState("");
  const shown = fields.filter((f) => !q || `${f.n} ${f.a} ${f.t.join(" ")}`.toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="fieldsview">
      <div className="fieldsbar">
        <input className="searchbox" placeholder="Search fields" value={q} onChange={(e) => setQ(e.target.value)} />
        <span className="rowcount tnum">{shown.length} of {fields.length}</span>
        <span className="spacer" />
        <button className="btn solid" onClick={onAdd}>Add custom field</button>
      </div>
      <div className="gridwrap">
        <table className="grid fieldstable">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Alias</th><th>Tabs</th><th>Type</th><th>Choices</th><th /></tr>
          </thead>
          <tbody>
            {shown.map((f) => (
              <tr key={f.n}>
                <td className="tnum pad6">{f.i}</td>
                <td className="pad6 mono">{f.n}</td>
                <td className="pad6">{f.a}</td>
                <td className="pad6 dim">{f.t.join(", ")}</td>
                <td className="pad6 dim">{f.y}</td>
                <td className="pad6 dim">{(f.o || []).join(" · ")}</td>
                <td className="rowend">{f.custom && <button className="del" onClick={() => onDelete(f.n)}>×</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}


/* ========================= MODALS ========================= */
function Modals(props) {
  const { modal, close } = props;
  useEffect(() => {
    const h = (e) => { if (e.key === "Escape") close(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [close]);
  return (
    <div className="scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="sheet" role="dialog" aria-modal="true">
        {modal.type === "addtract"      && <AddTract {...props} />}
        {modal.type === "addowner"      && <AddOwner {...props} />}
        {modal.type === "columns"       && <Columns {...props} />}
        {modal.type === "addfield"      && <AddField {...props} />}
        {modal.type === "confirmDelete" && <ConfirmDelete {...props} />}
        {modal.type === "confirmImport" && <ConfirmImport {...props} />}
        {modal.type === "remind"        && <Remind {...props} />}
        {modal.type === "importErrors"  && <ImportErrors {...props} />}
        {modal.type === "download"      && <DownloadSheet {...props} />}
      </div>
    </div>
  );
}

function AddTract({ fieldByName, parentIds, onAddTract, close }) {
  const [single, setSingle] = useState(true);
  const [v, setV] = useState({ Order: "", TractID: "", TractName: "", TractType: "Parent", State: "", County: "" });
  const blank = () => ({ OwnerName: "", OwnerType: "Individual", OwnerPct: "" });
  const [owners, setOwners] = useState([blank()]);          // single is the default mode

  const setOwner = (i, patch) => setOwners((p) => p.map((o, j) => (j === i ? { ...o, ...patch } : o)));

  /* Single owner means one interest, whatever is parked in state behind it. */
  const lines = single ? owners.slice(0, 1) : owners;
  const filled = lines.filter((o) => String(o.OwnerName).trim());
  const pctTotal = filled.reduce((a, o) => a + (parseFloat(o.OwnerPct) || 0), 0);
  const anyPct = filled.some((o) => String(o.OwnerPct).trim());

  const dup = v.TractID && parentIds.includes(String(v.TractID).trim());
  const tractOk = TRACT_REQ.every((n) => String(v[n] || "").trim()) && !dup;
  const overAllocated = anyPct && pctTotal > 100.0001;
  const ok = tractOk && !overAllocated && (!single || filled.length === 1);

  const typeOpts = fieldByName.OwnerType?.o || [];
  const pctAlias = fieldByName.OwnerPct?.a || "Ownership Percentage";

  return (
    <>
      <h3>Add tract</h3>

      <div style={{ display: "flex", gap: 6, padding: "10px 18px 0" }}>
        {[["Single owner", true], ["Multiple owners", false]].map(([label, val]) => (
          <button key={label} type="button"
            onClick={() => {
              setSingle(val);
              setOwners((p) => (val ? p.slice(0, 1) : p.length >= 2 ? p : [...p, blank()]));
            }}
            style={{ flex: 1, padding: "9px 12px", borderRadius: 4, font: "inherit", fontSize: 12.5,
                     textAlign: "left", cursor: "pointer",
                     background: single === val ? "#E7F0FA" : "#FFFFFF",
                     border: `1px solid ${single === val ? "#1F6FBF" : "#D4DBE4"}`,
                     color: single === val ? "#12325C" : "#48586B",
                     fontWeight: single === val ? 600 : 500 }}>
            {label}
            <span style={{ display: "block", fontSize: 11, fontWeight: 400, color: "#6B7B8D", marginTop: 2 }}>
              {val ? "Tract and its one owner, entered together" : "Tract with the interests you know so far"}
            </span>
          </button>
        ))}
      </div>

      <p className="sheetlede" style={{ paddingTop: 10 }}>
        The tract name is the umbrella name on the line list \u2014 "BOB JONES ET AL". Order is
        yours to set; it drives how the line list sorts and need not be unique.
      </p>

      <div className="fieldgrid">
        {TRACT_REQ.map((n) => {
          const f = fieldByName[n];
          return (
            <label key={n} className="field">
              <span className="flabel">{f.a}<em className="req">required</em></span>
              {n === "TractType" ? (
                <select className="cell" value={v[n]} onChange={(e) => setV({ ...v, [n]: e.target.value })}>
                  {PARENT_TYPES.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              ) : (
                <input className="cell" inputMode={n === "Order" ? "decimal" : undefined}
                  value={v[n]} onChange={(e) => setV({ ...v, [n]: e.target.value })} />
              )}
            </label>
          );
        })}
      </div>

      <div style={{ margin: "0 18px", borderTop: "1px solid #E7ECF2", paddingTop: 12 }}>
        <span style={{ fontSize: 10.5, letterSpacing: ".06em", textTransform: "uppercase",
                       color: "#6B7B8D", fontWeight: 700 }}>
          {single ? "The owner" : "Ownership interests"}
        </span>
        <p style={{ margin: "3px 0 0", fontSize: 12, color: "#6B7B8D" }}>
          {single
            ? <>Saved as its own row at {v.TractID ? `${v.TractID}.001` : "\u2039tract id\u203A.001"} with 100% interest, so owner records stay one row per payee.</>
            : <>Each becomes its own row, numbered .001 upward. Leave a line blank to skip it, and add the rest later with Add owner. Percentages are optional \u2014 leave them empty until title work settles them.</>}
        </p>
      </div>

      <div style={{ padding: "10px 18px 0", display: "flex", flexDirection: "column", gap: 8 }}>
        {lines.map((o, i) => (
          <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
            <label className="field" style={{ flex: "1 1 auto", minWidth: 0 }}>
              {i === 0 && <span className="flabel">Owner Name{single && <em className="req">required</em>}</span>}
              <input className="cell" value={o.OwnerName}
                placeholder={single ? "" : `Owner ${i + 1}`}
                onChange={(e) => setOwner(i, { OwnerName: e.target.value })} />
            </label>
            <label className="field" style={{ flex: "0 0 140px" }}>
              {i === 0 && <span className="flabel">Owner Type</span>}
              <select className="cell" value={o.OwnerType} onChange={(e) => setOwner(i, { OwnerType: e.target.value })}>
                {typeOpts.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </label>
            {!single && (
              <label className="field" style={{ flex: "0 0 110px" }}>
                {i === 0 && <span className="flabel">{pctAlias}</span>}
                <input className="cell tnum" inputMode="decimal" style={{ textAlign: "right" }}
                  value={o.OwnerPct} onChange={(e) => setOwner(i, { OwnerPct: e.target.value })} />
              </label>
            )}
          </div>
        ))}

        {!single && (
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <button type="button" className="btn ghost" style={{ height: 26 }}
              onClick={() => setOwners((p) => [...p, blank()])}>Add another owner</button>
            {owners.length > 2 && (
              <button type="button" className="btn link" style={{ padding: "4px 6px" }}
                onClick={() => setOwners((p) => p.slice(0, -1))}>Remove last</button>
            )}
            {anyPct && (
              <span className="tnum" style={{ fontSize: 11.5, marginLeft: "auto",
                    color: overAllocated ? "#93382B" : pctTotal < 99.9999 ? "#6B7B8D" : "#17579A" }}>
                {Math.round(pctTotal * 1e4) / 1e4}% allocated
                {!overAllocated && pctTotal < 99.9999 ? " \u00B7 remainder unassigned" : ""}
              </span>
            )}
          </div>
        )}
      </div>

      {dup && <div className="warn" style={{ marginTop: 12 }}>Tract ID {v.TractID} is already in this line list.</div>}
      {overAllocated && <div className="warn" style={{ marginTop: 12 }}>Interests total {Math.round(pctTotal * 1e4) / 1e4}%. They cannot exceed 100%.</div>}

      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn solid" disabled={!ok}
          onClick={() => onAddTract({ ...v, TractID: String(v.TractID).trim() }, lines, single)}>
          {filled.length ? `Add tract and ${filled.length} owner${filled.length > 1 ? "s" : ""}` : "Add tract"}
        </button>
      </div>
    </>
  );
}

function AddOwner({ fieldByName, ownerEligible, onAddOwner, nextOwnerId, close }) {
  const eligible = ownerEligible;
  const [pid, setPid] = useState(eligible[0] ? String(eligible[0].TractID) : "");
  const [v, setV] = useState({ OwnerID: "", OwnerType: "Individual", OwnerName: "" });
  useEffect(() => { if (pid) setV((s) => ({ ...s, OwnerID: nextOwnerId(pid) })); }, [pid]);
  const ok = pid && v.OwnerID && v.OwnerType && String(v.OwnerName).trim();
  return (
    <>
      <h3>Add owner</h3>
      <p className="sheetlede">County, state, section, acreage, and footage copy down from the parent tract and stay in step with it.</p>
      <div className="fieldgrid">
        <label className="field">
          <span className="flabel">Parent tract<em className="req">required</em></span>
          <select className="cell" value={pid} onChange={(e) => setPid(e.target.value)}>
            {eligible.map((r) => <option key={r._id} value={String(r.TractID)}>{r.TractID} — {r.TractName}</option>)}
          </select>
        </label>
        <label className="field">
          <span className="flabel">Owner Tract ID<em className="req">required</em></span>
          <input className="cell" value={v.OwnerID} onChange={(e) => setV({ ...v, OwnerID: e.target.value })} />
        </label>
        <label className="field">
          <span className="flabel">Owner Type<em className="req">required</em></span>
          <select className="cell" value={v.OwnerType} onChange={(e) => setV({ ...v, OwnerType: e.target.value })}>
            {(fieldByName.OwnerType?.o || []).map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        </label>
        <label className="field wide">
          <span className="flabel">Owner Name<em className="req">required</em></span>
          <input className="cell" value={v.OwnerName} onChange={(e) => setV({ ...v, OwnerName: e.target.value })} />
        </label>
      </div>
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn solid" disabled={!ok}
          onClick={() => onAddOwner({ ParentID: pid, TractID: v.OwnerID, OwnerID: v.OwnerID, OwnerType: v.OwnerType, OwnerName: v.OwnerName.trim() })}>
          Add owner
        </button>
      </div>
    </>
  );
}

function Columns({ allCols, hiddenSet, gridKey, setHidden, close }) {
  const toggle = (n) => setHidden((p) => {
    const s = new Set(p[gridKey] || []);
    s.has(n) ? s.delete(n) : s.add(n);
    return { ...p, [gridKey]: s };
  });
  return (
    <>
      <h3>Columns</h3>
      <p className="sheetlede">Hidden columns come back when you reload — this is a working view, not a saved layout.</p>
      <div className="collist">
        {allCols.map((f) => (
          <label key={f.n} className="colrow">
            <input type="checkbox" checked={!hiddenSet.has(f.n)} onChange={() => toggle(f.n)} />
            <span>{f.a}</span>
            <em className="mono dim">{f.n}</em>
          </label>
        ))}
      </div>
      <div className="sheetfoot">
        <button className="btn link" onClick={() => setHidden((p) => ({ ...p, [gridKey]: new Set() }))}>Show all</button>
        <button className="btn solid" onClick={close}>Done</button>
      </div>
    </>
  );
}

function AddField({ onAddField, close }) {
  const [f, setF] = useState({ n: "", a: "", t: "Parent Tract", y: "Short Text", o: "" });
  /* Project fields live in the top bar and System fields are stamped by the
     app, so neither tab can host a user-defined field. */
  const nameOk = /^[A-Za-z0-9]{1,10}$/.test(f.n);
  const ok = nameOk && f.a.trim();
  return (
    <>
      <h3>Add custom field</h3>
      <p className="sheetlede">Field names stay at ten characters or fewer, letters and numbers only, so the line list survives a trip through a shapefile.</p>
      <div className="fieldgrid">
        <label className="field">
          <span className="flabel">Field name</span>
          <input className="cell mono" maxLength={10} value={f.n} onChange={(e) => setF({ ...f, n: e.target.value })} />
        </label>
        <label className="field">
          <span className="flabel">Alias</span>
          <input className="cell" value={f.a} onChange={(e) => setF({ ...f, a: e.target.value })} />
        </label>
        <label className="field">
          <span className="flabel">Tab</span>
          <select className="cell" value={f.t} onChange={(e) => setF({ ...f, t: e.target.value })}>
            {TAB_ORDER.filter((t) => t !== "Project" && t !== "System")
              .map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </label>
        <label className="field">
          <span className="flabel">Type</span>
          <select className="cell" value={f.y} onChange={(e) => setF({ ...f, y: e.target.value })}>
            {["Short Text", "Long Text", "Decimal Number", "Short Integer", "Long Integer", "Date", "List", "Multiple Selection"].map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </label>
        {(f.y === "List" || f.y === "Multiple Selection") && (
          <label className="field wide">
            <span className="flabel">Choices, comma separated</span>
            <input className="cell" value={f.o} onChange={(e) => setF({ ...f, o: e.target.value })} />
          </label>
        )}
      </div>
      {f.n && !nameOk && <div className="warn">Use up to ten letters or numbers, no spaces or punctuation.</div>}
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn solid" disabled={!ok}
          onClick={() => {
            const opts = f.o.split(",").map((s) => s.trim()).filter(Boolean);
            onAddField({ n: f.n, a: f.a.trim(), t: [f.t], y: f.y, ...(opts.length ? { o: opts } : {}) });
          }}>Add field</button>
      </div>
    </>
  );
}

function ConfirmDelete({ modal, onDelete, close }) {
  const r = modal.row;
  const owner = isOwnerRow(r);
  return (
    <>
      <h3>Delete {owner ? "owner row" : "tract"}</h3>
      <p className="sheetlede">
        {owner
          ? <>This removes the row for <strong>{r.OwnerName || r.TractID}</strong>. Its title, acquisition, legal, and cost entries go with it.</>
          : <>This removes tract <strong>{r.TractID}</strong> and every owner row under it. Nothing here can be undone — download a copy first if you need one.</>}
      </p>
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn danger" onClick={() => onDelete(r)}>Delete</button>
      </div>
    </>
  );
}

function ConfirmImport({ modal, onImport, close }) {
  return (
    <>
      <h3>Replace this line list</h3>
      <p className="sheetlede">Importing clears everything on screen and loads the file in its place. Download a copy first if you haven't.</p>
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn danger" onClick={() => { onImport(modal.file); close(); }}>Replace and import</button>
      </div>
    </>
  );
}

function DownloadSheet({ modal, onDownload, close }) {
  const [name, setName] = useState(modal.name || "");
  const clean = name.replace(/\.xlsx$/i, "").trim();
  return (
    <>
      <h3>Download line list</h3>
      <p className="sheetlede">
        The whole line list is written, filters and switches notwithstanding. Rename the file if
        this is a revision or a copy for someone.
      </p>
      <div className="fieldgrid">
        <label className="field wide">
          <span className="flabel">File name</span>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <input className="cell" autoFocus value={name}
              onChange={(e) => setName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && clean) onDownload(clean); }} />
            <span style={{ color: "#6B7B8D", fontSize: 12.5, flex: "0 0 auto" }}>.xlsx</span>
          </div>
        </label>
      </div>
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Cancel</button>
        <button className="btn solid" disabled={!clean} onClick={() => onDownload(clean)}>Download</button>
      </div>
    </>
  );
}

function Remind({ onAskDownload, close }) {
  return (
    <>
      <h3>Download a copy</h3>
      <p className="sheetlede">It's been ten minutes since your last download. This app keeps nothing — close the tab and the line list is gone.</p>
      <div className="sheetfoot">
        <button className="btn link" onClick={close}>Not now</button>
        <button className="btn solid" onClick={onAskDownload}>Download line list</button>
      </div>
    </>
  );
}

function ImportErrors({ modal, close }) {
  const { problems = [], columns = [] } = modal;
  const [copied, setCopied] = useState("");
  const areaRef = useRef(null);

  const header = ["Sheet Row", "Tract ID", "Field", "Field Name", "Value", "Issue", "Result"].join("\t");
  const body = problems.map((p) =>
    [p.row, p.tract, p.field, p.name, p.value, p.issue, p.kept === "cleared" ? "Left blank" : "Imported as typed"].join("\t")
  );
  const text = [
    columns.length ? `Columns not recognised: ${columns.join(", ")}` : null,
    columns.length ? "" : null,
    header, ...body,
  ].filter((x) => x !== null).join("\n");

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied("Copied to clipboard.");
    } catch {
      const el = areaRef.current;
      if (el) { el.select(); try { document.execCommand("copy"); setCopied("Copied to clipboard."); } catch { setCopied("Select the text below and copy it."); } }
    }
    setTimeout(() => setCopied(""), 4000);
  };

  const cleared = problems.filter((p) => p.kept === "cleared").length;

  return (
    <>
      <h3>Import finished with {problems.length} value{problems.length === 1 ? "" : "s"} to review</h3>
      <p className="sheetlede">
        Every row imported. {cleared > 0
          ? <>{cleared} value{cleared === 1 ? " was" : "s were"} the wrong type for the field and could not be stored, so {cleared === 1 ? "that cell was" : "those cells were"} left blank. </>
          : null}
        Values outside a pick list were kept exactly as they appeared, so nothing is lost \u2014 they show in the grid with a warning tint until corrected.
      </p>

      {columns.length > 0 && (
        <div className="warn" style={{ marginTop: 10 }}>
          Columns not recognised and skipped: {columns.join(", ")}
        </div>
      )}

      <div style={{ margin: "12px 18px 0", border: "1px solid #E7ECF2", borderRadius: 4, maxHeight: "40vh", overflow: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
          <thead>
            <tr>
              {["Row", "Tract ID", "Field", "Value", "Issue", "Result"].map((h) => (
                <th key={h} style={{ position: "sticky", top: 0, background: "#EDF1F6", color: "#12325C",
                      textAlign: "left", padding: "5px 8px", fontSize: 10.5, fontWeight: 700,
                      letterSpacing: ".04em", textTransform: "uppercase", borderBottom: "1px solid #D4DBE4" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {problems.map((p, i) => (
              <tr key={i} style={{ borderBottom: "1px solid #F2F5F8" }}>
                <td className="tnum" style={{ padding: "4px 8px", color: "#6B7B8D" }}>{p.row}</td>
                <td style={{ padding: "4px 8px" }}>{p.tract || "\u2014"}</td>
                <td style={{ padding: "4px 8px" }}>{p.field}</td>
                <td style={{ padding: "4px 8px", maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.value}</td>
                <td style={{ padding: "4px 8px", color: "#6B7B8D" }}>{p.issue}</td>
                <td style={{ padding: "4px 8px", color: p.kept === "cleared" ? "#93382B" : "#17579A" }}>
                  {p.kept === "cleared" ? "Left blank" : "Kept"}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <textarea ref={areaRef} readOnly value={text}
        style={{ position: "absolute", left: -9999, top: 0, width: 10, height: 10 }} />

      <div className="sheetfoot">
        {copied && <span style={{ marginRight: "auto", fontSize: 12, color: "#17579A" }}>{copied}</span>}
        <button className="btn ghost" onClick={copy}>Copy list</button>
        <button className="btn solid" onClick={close}>Done</button>
      </div>
    </>
  );
}


/* ========================= STYLES ========================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

.rlp{
  --navy:#12325C; --navy2:#1B4477; --navy3:#28558C;
  --blue:#1F6FBF; --blue2:#17579A; --blue-pale:#E7F0FA; --blue-line:#B8D2EC;
  --bg:#F4F6F9; --paper:#FFFFFF;
  --rule:#D4DBE4; --rule2:#E7ECF2;
  --text:#1B2735; --mid:#48586B; --dim:#6B7B8D;
  --sel:#E7F0FA; --calc:#F2F6FB; --calcline:#9EBFDF;
  --danger:#B33A2B;
  position:fixed; inset:0; display:flex; flex-direction:column;
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,sans-serif; font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.rlp *{box-sizing:border-box}
.rlp button{font:inherit; color:inherit; cursor:pointer}
.rlp input,.rlp select,.rlp textarea{font:inherit; color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11.5px}
.dim{color:var(--dim)}
.spacer{flex:1}
.rlp :focus-visible{outline:2px solid var(--blue); outline-offset:1px}

/* ---------- topbar ---------- */
.topbar{display:flex; align-items:center; gap:20px; padding:0 16px; height:56px;
  background:var(--navy); color:#F2F5F9; flex:0 0 auto}
.brand{display:flex; align-items:baseline; gap:8px; flex:0 0 auto}
.mark{font-weight:700; letter-spacing:.14em; font-size:12px; color:#BBD4EE;
  border:1px solid #3C6091; padding:3px 6px; border-radius:2px}
.wordmark{font-weight:600; font-size:14px; letter-spacing:-.01em}
.wordmark em{font-style:normal; color:#9FC2E5; font-weight:500}

.projstrip{display:flex; gap:10px; flex:1; min-width:0; overflow-x:auto}
.projfield{display:flex; flex-direction:column; gap:2px; min-width:118px}
.projfield span{font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:#A8C0DA}
.projfield input,.projfield select{background:#FFFFFF; border:1px solid #9FB6CE; border-radius:3px;
  color:#16233A; padding:3px 6px; height:24px; width:100%}
.projfield input:focus,.projfield select:focus{border-color:#fff}

.topactions{display:flex; gap:8px; flex:0 0 auto}

/* ---------- buttons ---------- */
.btn{border:1px solid transparent; border-radius:3px; padding:5px 12px; height:28px;
  font-size:12.5px; font-weight:500; white-space:nowrap}
.btn.pale{background:#E9EFF6; color:#153458; border-color:#B7C8DA}
.btn.pale:hover{background:#FFFFFF}
.btn.solid{background:var(--blue); color:#fff}
.btn.solid:hover{background:var(--blue2)}
.btn.solid:disabled{background:#AEBCCB; cursor:not-allowed}
.btn.ghost{background:var(--paper); border-color:var(--rule); color:var(--mid)}
.btn.ghost:hover{border-color:#A9BACB; color:var(--text)}
.btn.ghost.on{background:var(--blue-pale); border-color:var(--blue); color:var(--blue2)}
.btn.ghost:disabled{color:#A6B1BD; cursor:not-allowed; background:#EDF0F4}
.btn.link{background:none; color:var(--mid); padding:5px 8px}
.btn.link:hover{color:var(--text); text-decoration:underline}
.btn.danger{background:var(--danger); color:#fff}

/* ---------- tract header strip (single horizontal row, never wraps) ---------- */
.titleblock{
  background:var(--paper); border-bottom:1px solid var(--rule);
  border-top:2px solid var(--navy); flex:0 0 auto; height:44px; overflow:hidden;
}
.tbcell{
  gap:7px; padding:0 12px; height:44px; line-height:44px;
  border-right:1px solid var(--rule2); white-space:nowrap; overflow:hidden;
}
.tbcell:last-child{border-right:none}
.tbcount{background:#F7F9FC}
.tblabel{flex:0 0 auto; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--dim); font-weight:600}
.tbvalue{flex:1 1 auto; min-width:0; font-size:13px; font-weight:600; color:var(--text);
  overflow:hidden; text-overflow:ellipsis}
.titleblock.empty .tbvalue{color:#AAB6C3; font-weight:500}

/* ---------- nav ---------- */
.nav{display:flex; align-items:center; gap:2px; padding:0 12px; height:40px;
  background:var(--navy2); overflow-x:auto; flex:0 0 auto}
.navcap{font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#B9D4EE;
  margin-right:8px; flex:0 0 auto; font-weight:600}
.navdiv{width:1px; height:18px; background:#3C6091; margin:0 10px; flex:0 0 auto}
.navbtn{background:none; border:none; color:#FFFFFF; padding:6px 11px; border-radius:3px;
  font-size:13px; font-weight:500; white-space:nowrap; flex:0 0 auto}
.navbtn:hover{background:var(--navy3); color:#FFFFFF}
.navbtn.on{background:var(--paper); color:var(--navy); font-weight:600}
.navbtn:disabled{color:#8FAAC6; cursor:not-allowed; background:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid var(--rule); flex:0 0 auto}
.rowcount{font-size:11.5px; color:var(--dim)}
.searchbox{background:var(--paper); border:1px solid var(--rule); border-radius:3px;
  padding:4px 9px; height:28px; width:220px}
.searchbox:focus{border-color:var(--blue)}

/* ---------- stage ---------- */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}

/* ---------- grid ---------- */
.gridwrap{flex:1 1 auto; min-height:0; overflow:auto; position:relative; background:var(--paper)}
/* the header must be the only thing pinned while the body scrolls under it */
.grid thead{position:sticky; top:0; z-index:6}
.grid{border-collapse:separate; border-spacing:0; table-layout:fixed}
.grid th{position:sticky; top:0; z-index:3; background:#EDF1F6; text-align:left;
  box-sizing:border-box; padding:0 8px; height:30px; font-size:10.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:var(--navy);
  border-right:1px solid var(--rule2); border-bottom:1px solid var(--rule);
  cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; vertical-align:middle}
/* numeric columns are right-aligned in the body, so their headers are too */
.grid th.numhead{text-align:right}
.grid th.numhead .thlabel{float:none}
.grid th:hover{background:#E2E9F2}
.thlabel{display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom}
.sortmark{margin-left:4px; color:var(--blue)}
.grid th.stick,.grid td.stick{position:sticky; left:0; z-index:2}
.grid th.stick{z-index:4}
.grid td.stick{background:var(--paper); border-right:1px solid var(--rule)}
.grid tr.sel td.stick{background:var(--sel)}
.grid tr.ownerrow td.stick{background:#EFF3F8}
.grid tr.permitrow td.stick{background:#FAF0EF}
.grid tr.sel.ownerrow td.stick,.grid tr.sel.permitrow td.stick{background:var(--sel)}
.filterrow th{top:30px; z-index:3; background:#F6F8FB; padding:2px 3px; height:28px; cursor:default}
.filterrow input{width:100%; height:22px; border:1px solid var(--rule2); border-radius:2px;
  padding:0 5px; font-size:11.5px; background:#fff}
.thend{width:72px; cursor:default}

.grid td{box-sizing:border-box; height:${ROW_H}px; padding:0; border-right:1px solid #EFF2F6;
  border-bottom:1px solid #EFF2F6; overflow:hidden; vertical-align:middle}
/* Row shading carries the row's role: owner rows a step of grey-blue,
   crossing tracts (Permit, Encroachment) a faded maroon. Exclusive Easement
   is an ordinary parent tract, so it stays white. Hover keeps each hue. */
.grid tr.ownerrow{background:#EFF3F8}
.grid tr.permitrow{background:#FAF0EF}
.grid tr.sel{background:var(--sel)}
.grid tr:hover td{background:#F3F7FC}
.grid tr.ownerrow:hover td{background:#E6ECF4}
.grid tr.permitrow:hover td{background:#F5E4E2}
.grid tr.sel:hover td{background:#DCEAF8}
.grid tr.sel.ownerrow:hover td,.grid tr.sel.permitrow:hover td{background:#DCEAF8}

.cell{display:block; box-sizing:border-box; width:100%; height:${ROW_H - 2}px;
  border:none; background:transparent; padding:0 8px; font-size:12.5px; margin:0}
.cell:focus{background:#fff; box-shadow:inset 0 0 0 2px var(--blue); border-radius:2px}
.cell.num{text-align:right}
.cell.calc{background:var(--calc); box-shadow:inset 0 -2px 0 var(--calcline)}
.cell.ro{display:flex; align-items:center; color:var(--dim); font-size:12px}
select.cell{appearance:none; cursor:pointer}
.rowend{text-align:center; background:var(--paper); white-space:nowrap; padding:0 2px}
.openform{background:none; border:1px solid var(--rule); border-radius:3px; color:var(--blue2);
  font-size:11px; font-weight:600; padding:2px 6px; margin-right:2px}
.openform:hover{background:var(--blue-pale); border-color:var(--blue)}
.del{background:none; border:none; color:#AFBAC6; font-size:16px; line-height:1; padding:2px 6px; border-radius:3px}
.del:hover{color:var(--danger); background:#F8EAE7}

/* ---------- empty ---------- */
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; text-align:center; padding:40px}
.emptyrule{width:56px; height:2px; background:var(--blue)}
.empty h2{margin:0; font-size:18px; font-weight:600}
.empty p{margin:0; max-width:420px; color:var(--mid)}
.emptyactions{display:flex; gap:8px; margin-top:8px}

/* ---------- form ---------- */
.form{flex:1; min-height:0; display:flex; overflow:hidden}
.formside{flex:0 0 210px; border-right:1px solid var(--rule); background:#F7F9FC; overflow:auto; padding:8px}
.sidebtn{display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  background:none; border:1px solid transparent; border-radius:4px; padding:7px 9px; margin-bottom:3px}
.sidebtn:hover{background:#EBF1F8}
.sidebtn.on{background:var(--paper); border-color:var(--blue); box-shadow:0 1px 2px rgba(18,50,92,.10)}
.sidecap{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.sideval{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.formmain{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}
.formtabs{display:flex; gap:2px; padding:8px 14px 0; overflow-x:auto;
  border-bottom:1px solid var(--rule); background:#F7F9FC; flex:0 0 auto}
.ftab{background:none; border:none; border-bottom:3px solid transparent; padding:7px 12px;
  font-size:12.5px; font-weight:500; color:var(--mid); white-space:nowrap; flex:0 0 auto}
.ftab:hover{color:var(--navy); background:#EBF1F8}
.ftab.on{color:var(--navy); font-weight:700; border-bottom-color:var(--blue); background:var(--paper)}

.fieldgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px 16px;
  padding:16px; overflow:auto}
.field{display:flex; flex-direction:column; gap:3px; min-width:0}
.field.wide{grid-column:1/-1}
.flabel{display:flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mid); font-weight:600}
.autotag{font-style:normal; font-size:9px; letter-spacing:.08em; color:var(--blue2);
  background:var(--calc); border:1px solid var(--calcline); border-radius:2px; padding:0 4px}
.req{font-style:normal; font-size:9px; letter-spacing:.06em; color:var(--danger)}
.field .cell{height:30px; border:1px solid var(--rule); border-radius:3px; background:var(--paper)}
.field textarea.cell{height:auto; padding:6px 8px; resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:3px 10px;
  font-size:12px; color:var(--mid)}
.chip.on{background:var(--blue-pale); border-color:var(--blue); color:var(--blue2); font-weight:600}

.notice{padding:14px 16px; color:var(--mid); background:#F7F9FC;
  border:1px dashed var(--rule); border-radius:4px; margin:16px}
.notice.pad{margin:24px}

/* ---------- owner list ---------- */
.ownerlist{flex:1; overflow:auto; padding:16px 18px}
.lede{margin:0 0 14px; color:var(--mid); max-width:620px}
.ownercard{background:var(--paper); border:1px solid var(--rule2); border-radius:4px; margin-bottom:6px}
.ownercard.open{border-color:var(--blue)}
.ownerhead{display:flex; align-items:baseline; gap:14px; width:100%; text-align:left;
  background:none; border:none; padding:10px 14px}
.ownername{font-weight:600; font-size:13.5px}
.ownermeta{font-size:11.5px; color:var(--dim); flex:0 0 auto}
.ownertracts{font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ownerbody{border-top:1px solid var(--rule2)}
.ownerfoot{display:flex; gap:8px; align-items:center; padding:0 16px 14px}

/* ---------- fields view ---------- */
.fieldsview{flex:1; min-height:0; display:flex; flex-direction:column}
.fieldsbar{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule)}
.fieldstable{width:100%; table-layout:auto}
.fieldstable td{height:28px}
.pad6{padding:0 10px; font-size:12.5px}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(18,50,92,.42); display:flex;
  align-items:center; justify-content:center; padding:24px; z-index:50}
.sheet{background:var(--paper); border-radius:5px; width:min(640px,100%); max-height:88vh;
  overflow:auto; box-shadow:0 18px 48px rgba(18,50,92,.30); border-top:3px solid var(--blue)}
.sheet h3{margin:0; padding:16px 18px 4px; font-size:16px; font-weight:600; color:var(--navy)}
.sheetlede{margin:0; padding:0 18px; color:var(--mid)}
.sheet .fieldgrid{padding:14px 18px}
.sheetfoot{display:flex; justify-content:flex-end; gap:8px; padding:12px 18px 16px;
  border-top:1px solid var(--rule2)}
.warn{margin:0 18px; padding:8px 10px; background:#FAEDEA; border-left:3px solid var(--danger);
  color:#8E2E22; font-size:12.5px; border-radius:2px}
.collist{padding:12px 18px; max-height:46vh; overflow:auto}
.colrow{display:flex; align-items:center; gap:9px; padding:4px 0}
.colrow em{margin-left:auto; font-style:normal}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  background:var(--navy); color:#F2F5F9; padding:10px 16px; border-radius:4px;
  box-shadow:0 8px 22px rgba(18,50,92,.30); max-width:640px; z-index:60; font-size:12.5px}

@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translate(-50%,8px)}to{opacity:1; transform:translate(-50%,0)}}
}
@media (max-width:1100px){
  .titleblock{overflow-x:auto}
}
@media (max-width:900px){
  .projstrip{display:none}
  .formside{flex-basis:150px}
}
`;
